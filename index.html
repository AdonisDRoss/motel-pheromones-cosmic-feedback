<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#05070b;color:#d8f7ff;overflow:hidden!important;position:fixed;inset:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none;overscroll-behavior:none;}

#objectiveHud{position:fixed;left:calc(env(safe-area-inset-left) + 6px);top:calc(env(safe-area-inset-top) + 72px);z-index:21;width:160px;max-width:28vw;padding:4px 6px;border:1px solid rgba(190,95,255,.38);background:rgba(12,5,22,.50);color:#f1eaff;font:7px/1.2 monospace;pointer-events:none;text-shadow:0 0 4px #8a5cff;}
#objectiveHud .objTitle{color:#d9b8ff;font-weight:800;letter-spacing:.6px;margin-bottom:3px;}
#hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 7px);transform:translateX(-50%);z-index:22;padding:4px 7px;border:1px solid rgba(160,210,255,.50);background:rgba(0,0,0,.62);color:#e8fbff;font:9px monospace;display:none;white-space:nowrap;max-width:70vw;overflow:hidden;text-overflow:ellipsis;}
#dialogue{position:fixed;left:calc(env(safe-area-inset-left) + 10px);bottom:calc(env(safe-area-inset-bottom) + 96px);z-index:70;width:min(560px,62vw);max-width:62vw;padding:6px 8px;border:1px solid rgba(124,217,255,.58);background:rgba(2,5,12,.86);box-shadow:0 0 14px rgba(115,32,255,.22);display:none;color:#e8fbff;font:11px/1.18 system-ui,-apple-system,Segoe UI,sans-serif;pointer-events:auto;}

#dialogue button{background:#122033;color:#e8fbff;border:1px solid #4a79a8;border-radius:5px;padding:5px 7px;font-size:11px;font-weight:650;touch-action:manipulation;}
.stick{pointer-events:auto;position:fixed;left:calc(env(safe-area-inset-left) + 20px);bottom:calc(env(safe-area-inset-bottom) + 30px);width:116px;height:116px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.05);z-index:25;touch-action:none;}
.nub{position:absolute;width:48px;height:48px;border-radius:50%;left:34px;top:34px;background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.35);}
.buttons{pointer-events:auto;position:fixed;right:calc(env(safe-area-inset-right) + 18px);bottom:calc(env(safe-area-inset-bottom) + 22px);z-index:25;touch-action:none;}
.btn{pointer-events:auto;position:absolute;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font:9px/1.05 monospace;border:2px solid rgba(255,255,255,.18);background:rgba(60,90,120,.38);user-select:none;}
.a{right:0;bottom:28px;background:rgba(55,150,75,.40)} .b{right:58px;bottom:0;background:rgba(150,55,70,.40)} .x{right:58px;bottom:64px;background:rgba(60,120,170,.40)} .y{right:116px;bottom:28px;background:rgba(150,140,60,.40)} .r{right:0;bottom:92px;background:rgba(120,70,180,.48)}
.version{position:fixed;right:calc(env(safe-area-inset-right) + 12px);bottom:calc(env(safe-area-inset-bottom) + 8px);z-index:15;color:#9eefff;background:rgba(0,0,0,.45);border:1px solid rgba(124,217,255,.3);padding:3px 6px;font:9px monospace;}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 8px);transform:translateX(-50%);z-index:80;display:none;max-width:70vw;padding:7px 10px;border:1px solid rgba(124,217,255,.55);background:rgba(2,5,12,.82);color:#e8fbff;font:11px/1.2 monospace;text-align:center;box-shadow:0 0 14px rgba(115,32,255,.20);pointer-events:none;}

#shop{

<div class="version">Highway Loop / Screen Aspect Fix v123</div>
<script>
(() => {
const qs = new URLSearchParams(location.search);
const AREA = qs.get("area") || "highway_loop";
const LOOP_CHUNK = Math.max(0, parseInt(qs.get("chunk") || "0", 10) || 0);
const LOOP_ENTRY = qs.get("entry") || "south";
const START_IN_CAR = qs.get("vehicle") === "car";
const COLLISION_MODE = qs.get("collision") || "mask";
const MAPS = {
  a1: {
    key:"blacklight_a1",
    zone:"BLACKLIGHT A1",
    base:"assets/maps/dust9/glasswell/blacklight_district/a1/layers/GLASSWELL_BLACKLIGHT_A1_base.png",
    mask:"assets/maps/dust9/glasswell/blacklight_district/a1/masks/GLASSWELL_BLACKLIGHT_A1_collision_mask.png",
    spawn:[0.455,0.700],
    objective:"Find Kira Volt",
    exitText:"Return to Westgate Connector"
  },
  club: {
    key:"blacklight_club",
    zone:"BLACKLIGHT CLUB",
    base:"assets/maps/dust9/glasswell/blacklight_club/interior/GLASSWELL_BLACKLIGHT_CLUB_INTERIOR_base.png",
    mask:"assets/maps/dust9/glasswell/blacklight_club/interior/GLASSWELL_BLACKLIGHT_CLUB_INTERIOR_collision_mask.png",
    spawn:[0.50,0.86],
    objective:"Find Kira at the DJ booth",
    exitText:"Exit to Blacklight A1"
  },
  highway: {
    key:"highway_offramp",
    zone:"HIGHWAY OFF-RAMP",
    base:"assets/maps/dust9/glasswell/road_kit/highway_roads/highway_off_or_on_ramp.png",
    mask:"assets/maps/dust9/glasswell/road_kit/highway_roads/highway_off_or_on_ramp_collision_mask.png",
    spawn:[0.72,0.50],
    objective:"Follow the ramp back to Westgate",
    exitText:"Enter Westgate Connector"
  },
  westgate: {
    key:"westgate",
    zone:"WESTGATE",
    base:"assets/maps/dust9/glasswell/outer_ring/west_blacklight/layers/GLASSWELL_WESTGATE_BLACKLIGHT_CONNECTOR_base.png",
    mask:"assets/maps/dust9/glasswell/outer_ring/west_blacklight/masks/GLASSWELL_WESTGATE_BLACKLIGHT_CONNECTOR_collision_mask.png",
    spawn:[0.50,0.50],
    objective:"Enter Blacklight District",
    exitText:"Enter Blacklight District"
  }
};

const HIGHWAY_TILE_PATHS = {
  ramp:"assets/maps/dust9/glasswell/road_kit/highway_roads/highway_off_or_on_ramp.png",
  straight1:"assets/maps/dust9/glasswell/road_kit/highway_roads/highway_straight_01.png",
  straight2:"assets/maps/dust9/glasswell/road_kit/highway_roads/highway_straight_02.png",
  curve:"assets/maps/dust9/glasswell/road_kit/highway_roads/highway_curve_01.png"
};

const HIGHWAY_LOOP = [
  {id:"OFFRAMP_WESTGATE_BLACKLIGHT", type:"offramp", tile:"ramp", exit:"Westgate / Blacklight"},
  {id:"STRAIGHT_01", type:"straight", tile:"straight1"},
  {id:"STRAIGHT_02", type:"straight", tile:"straight2"},
  {id:"STRAIGHT_03", type:"straight", tile:"straight1"},
  {id:"TURN_01", type:"turn", tile:"curve"},
  {id:"STRAIGHT_04", type:"straight", tile:"straight2"},
  {id:"STRAIGHT_05", type:"straight", tile:"straight1"},
  {id:"STRAIGHT_06", type:"straight", tile:"straight2"},
  {id:"OFFRAMP_GLASSWELL_NORTH", type:"offramp", tile:"ramp", exit:"Glasswell North / Civic Gate"},
  {id:"STRAIGHT_07", type:"straight", tile:"straight1"},
  {id:"STRAIGHT_08", type:"straight", tile:"straight2"},
  {id:"STRAIGHT_09", type:"straight", tile:"straight1"},
  {id:"TURN_02", type:"turn", tile:"curve"},
  {id:"STRAIGHT_10", type:"straight", tile:"straight2"},
  {id:"STRAIGHT_11", type:"straight", tile:"straight1"},
  {id:"STRAIGHT_12", type:"straight", tile:"straight2"},
  {id:"OFFRAMP_GLASSWELL_EAST", type:"offramp", tile:"ramp", exit:"Glasswell East / Admin-Ration"},
  {id:"STRAIGHT_13", type:"straight", tile:"straight1"},
  {id:"STRAIGHT_14", type:"straight", tile:"straight2"},
  {id:"STRAIGHT_15", type:"straight", tile:"straight1"},
  {id:"TURN_03", type:"turn", tile:"curve"},
  {id:"STRAIGHT_16", type:"straight", tile:"straight2"},
  {id:"STRAIGHT_17", type:"straight", tile:"straight1"},
  {id:"STRAIGHT_18", type:"straight", tile:"straight2"},
  {id:"OFFRAMP_GLASSWELL_SOUTH", type:"offramp", tile:"ramp", exit:"Glasswell South / Transit-Industrial"},
  {id:"STRAIGHT_19", type:"straight", tile:"straight1"},
  {id:"STRAIGHT_20", type:"straight", tile:"straight2"},
  {id:"STRAIGHT_21", type:"straight", tile:"straight1"},
  {id:"RETURN_TO_WESTGATE_OFFRAMP", type:"return", tile:"straight2"}
];

function loopChunk(){
  const n = HIGHWAY_LOOP.length;
  return ((LOOP_CHUNK % n) + n) % n;
}
function highwayLoopConfig(){
  const c = HIGHWAY_LOOP[loopChunk()];
  return {
    key:"highway_loop_" + loopChunk(),
    zone:c.id,
    base:HIGHWAY_TILE_PATHS[c.tile],
    mask:null,
    spawn:[0.50,LOOP_ENTRY==="north" ? 0.12 : 0.88],
    objective:`Highway Loop ${loopChunk()+1}/${HIGHWAY_LOOP.length}: ${c.id}`,
    exitText:"Continue Highway Loop"
  };
}

let mapCfg = (AREA==="highway_loop") ? highwayLoopConfig() : (MAPS[AREA] || MAPS.a1);
const WORLD_SCALE = AREA === "a1" ? 3.0 : (AREA === "club" ? 1.0 : ((AREA === "highway" || AREA==="highway_loop") ? 1.25 : 1.0));

const VEHICLES = {
  donnyCar:"assets/vehicles/special/aurelix_distortion/distortion_topdown.png"
};

function cfSaveActiveVehicle(scene){
  try{
    if(!scene || !scene.vehicleMode || !scene.vehicle) return;
    const data={
      active:true,
      stolen:!!scene.vehicle.stolen,
      carKey:(scene.vehicle.texture&&scene.vehicle.texture.key)||"donny_car",
      speed:Math.round(scene.vehicleSpeed||0),
      heading:Math.round(scene.vehicleHeading ?? ((scene.vehicle.angle||0)-90)),
      lane: 1,
      t:Date.now()
    };
    localStorage.setItem("cf_active_vehicle", JSON.stringify(data));
  }catch(e){}
}
function cfClamp01(v){
  return Math.max(0, Math.min(1, v));
}

function cfRoadCenterX(scene, y, laneIndex = 1) {
  if (!scene || !scene.mapH) return 400;
  const progress = cfClamp01(y / scene.mapH);
  const type = (HIGHWAY_LOOP[loopChunk()] || {}).type || "straight";
  const midX = scene.mapW * 0.5;
  let baseCenter = midX;
  if (type === "turn") {
    baseCenter = midX + Math.sin(progress * Math.PI) * (scene.mapW * 0.16);
  } else if (type === "offramp") {
    baseCenter = midX - (progress * 40 * WORLD_SCALE);
  }
  const totalLanes = 4;
  const laneSpacing = 24 * WORLD_SCALE;
  const offset = (laneIndex - (totalLanes - 1) * 0.5) * laneSpacing;
  return baseCenter + offset;
}

function cfRoadHeading(scene, y, laneIndex = 1, dir = -1) {
  const deltaY = 6;
  const nextY = y + (dir * deltaY);
  const x1 = cfRoadCenterX(scene, y, laneIndex);
  const x2 = cfRoadCenterX(scene, nextY, laneIndex);
  return Math.atan2(nextY - y, x2 - x1) * (180 / Math.PI);
}

class GameScene extends Phaser.Scene {
  constructor() {
    super("GameScene");
  }

  preload() {
    this.load.image(mapCfg.key, mapCfg.base);
    this.load.image("donnyCar", VEHICLES.donnyCar);
  }

  create() {
    const bg = this.add.image(0, 0, mapCfg.key).setOrigin(0, 0);
    this.mapW = bg.width;
    this.mapH = bg.height;

    this.physics.world.setBounds(0, 0, this.mapW, this.mapH);

    this.vehicleMode = true;
    this.vehicleSpeed = 0;
    this.maxVehicleSpeed = 6.5;
    
    this.vehicle = this.physics.add.sprite(cfRoadCenterX(this, this.mapH * 0.8, 1), this.mapH * 0.8, "donnyCar");
    this.vehicle.setOrigin(0.5, 0.5);
    this.vehicle.setScale(WORLD_SCALE);
    this.vehicle.setCollideWorldBounds(true);

    // --- TRAFFIC SETUP ---
    this.trafficGroup = this.physics.add.group();
    this.npcs = [];
    
    this.laneSpeeds = [2.2, 3.1, 3.8, 2.7]; 
    const numTrafficCars = (AREA === "highway_loop") ? 6 : 0;

    for (let i = 0; i < numTrafficCars; i++) {
      let spawnY = (this.mapH / numTrafficCars) * i;
      let laneIndex = Phaser.Math.Between(0, 3);
      
      let npcCar = this.physics.add.sprite(
        cfRoadCenterX(this, spawnY, laneIndex),
        spawnY,
        "donnyCar"
      );
      
      npcCar.setOrigin(0.5, 0.5);
      npcCar.setScale(WORLD_SCALE);
      npcCar.setTint(0x7c94ff + (i * 0x110011)); 
      
      npcCar.laneIndex = laneIndex;
      npcCar.travelDirection = -1; 
      npcCar.baseSpeed = this.laneSpeeds[laneIndex] + Phaser.Math.FloatBetween(-0.15, 0.15);
      npcCar.currentSpeed = npcCar.baseSpeed;
      
      this.trafficGroup.add(npcCar);
      this.npcs.push(npcCar);
    }

    this.physics.add.collider(this.vehicle, this.trafficGroup, (player, npc) => {
      this.vehicleSpeed *= 0.4; 
      this.cameras.main.shake(120, 0.006);
    });

    this.cameras.main.startFollow(this.vehicle, true, 0.1, 0.1);
    this.cameras.main.setBounds(0, 0, this.mapW, this.mapH);
    
    // Default uniform baseline focus
    this.cameras.main.setZoom(1.0);

    document.getElementById("mode").innerText = "DRIVING";
    document.getElementById("carHudBlock").style.display = "block";
    document.getElementById("objectiveText").innerText = mapCfg.objective;
  }

  update(time, delta) {
    const dtFactor = delta / 16.666;

    let input = window.cfActiveControls || {x:0, y:0, a:false, b:false, r:false};
    
    if (input.a) {
      this.vehicleSpeed = Math.min(this.maxVehicleSpeed, this.vehicleSpeed + 0.08 * dtFactor);
    } else if (input.b) {
      this.vehicleSpeed = Math.max(-1.5, this.vehicleSpeed - 0.12 * dtFactor);
    } else {
      this.vehicleSpeed *= Math.pow(0.97, dtFactor);
    }

    if (Math.abs(this.vehicleSpeed) > 0.1) {
      this.vehicle.x += input.x * 3.5 * dtFactor * WORLD_SCALE;
    }

    this.vehicle.y -= this.vehicleSpeed * dtFactor;

    if (this.vehicle.y < 0) {
      this.vehicle.y = this.mapH;
      this.nextChunkLoop();
      return;
    } else if (this.vehicle.y > this.mapH) {
      this.vehicle.y = 0;
    }

    let playerLane = 1;
    let midX = this.mapW * 0.5;
    if (this.vehicle.x < midX - 12) playerLane = 0;
    else if (this.vehicle.x > midX + 36) playerLane = 3;
    else if (this.vehicle.x > midX + 12) playerLane = 2;

    let hAngle = cfRoadHeading(this, this.vehicle.y, playerLane, -1);
    this.vehicle.angle = hAngle + 180;

    // --- TRAFFIC MOVEMENT CORE ---
    this.npcs.forEach((npc) => {
      npc.y += (npc.travelDirection * npc.currentSpeed * dtFactor);
      
      if (npc.y < 0) {
        npc.y = this.mapH;
        npc.laneIndex = Phaser.Math.Between(0, 3);
        npc.currentSpeed = this.laneSpeeds[npc.laneIndex] + Phaser.Math.FloatBetween(-0.15, 0.15);
      } else if (npc.y > this.mapH) {
        npc.y = 0;
      }

      npc.x = cfRoadCenterX(this, npc.y, npc.laneIndex);
      let npcHheading = cfRoadHeading(this, npc.y, npc.laneIndex, npc.travelDirection);
      npc.angle = npcHheading + 180;

      this.handleNpcAiTicks(npc);
    });

    let spdPct = Math.round(cfClamp01(Math.abs(this.vehicleSpeed) / this.maxVehicleSpeed) * 100);
    document.getElementById("speedBar").style.width = spdPct + "%";
    document.getElementById("coordLine").innerText = `XY: ${Math.round(this.vehicle.x)}, ${Math.round(this.vehicle.y)}`;
  }

  handleNpcAiTicks(npc) {
    let safeBufferY = 130;
    let obstacleTriggered = false;

    this.npcs.forEach((other) => {
      if (npc === other) return;
      
      if (npc.laneIndex === other.laneIndex) {
        let diffY = npc.y - other.y; 
        if (diffY > 0 && diffY < safeBufferY) {
          obstacleTriggered = true;
          
          let switchLeft = npc.laneIndex - 1;
          let switchRight = npc.laneIndex + 1;
          
          if (switchLeft >= 0 && !this.isSpecificLaneOccupied(switchLeft, npc.y)) {
            npc.laneIndex = switchLeft;
          } else if (switchRight <= 3 && !this.isSpecificLaneOccupied(switchRight, npc.y)) {
            npc.laneIndex = switchRight;
          } else {
            npc.currentSpeed = Math.max(1.2, other.currentSpeed - 0.4);
          }
        }
      }
    });

    if (!obstacleTriggered && npc.currentSpeed < npc.baseSpeed) {
      npc.currentSpeed += 0.04;
    }
  }

  isSpecificLaneOccupied(laneIndex, currentY) {
    let padding = 90;
    return this.npcs.some((car) => {
      return car.laneIndex === laneIndex && Math.abs(car.y - currentY) < padding;
    });
  }

  nextChunkLoop() {
    cfSaveActiveVehicle(this);
    const nextChunk = (LOOP_CHUNK + 1) % HIGHWAY_LOOP.length;
    location.search = `?area=highway_loop&chunk=${nextChunk}&vehicle=car&entry=south`;
  }
}

window.cfActiveControls = {x:0, y:0, a:false, b:false, r:false};
function setupControls() {
  const stick = document.getElementById("stick");
  const nub = document.getElementById("nub");
  let activeTouchId = null;
  let startX = 0, startY = 0;

  stick.addEventListener("touchstart", (e) => {
    if (activeTouchId !== null) return;
    const touch = e.changedTouches[0];
    activeTouchId = touch.identifier;
    const rect = stick.getBoundingClientRect();
    startX = rect.left + rect.width / 2;
    startY = rect.top + rect.height / 2;
  }, {passive:true});

  stick.addEventListener("touchmove", (e) => {
    if (activeTouchId === null) return;
    for (let t of e.changedTouches) {
      if (t.identifier === activeTouchId) {
        let dx = t.clientX - startX;
        let dy = t.clientY - startY;
        let dist = Math.sqrt(dx*dx + dy*dy);
        if (dist > 40) { dx *= 40/dist; dy *= 40/dist; dist = 40; }
        nub.style.transform = `translate(${dx}px, ${dy}px)`;
        window.cfActiveControls.x = dx / 40;
        window.cfActiveControls.y = dy / 40;
      }
    }
  }, {passive:true});

  const resetStick = () => { activeTouchId = null; nub.style.transform = "none"; window.cfActiveControls.x = 0; window.cfActiveControls.y = 0; };
  stick.addEventListener("touchend", resetStick); stick.addEventListener("touchcancel", resetStick);

  document.querySelectorAll(".btn").forEach(b => {
    const key = b.getAttribute("data-btn");
    const press = () => { if(key) window.cfActiveControls[key] = true; };
    const release = () => { if(key) window.cfActiveControls[key] = false; };
    b.addEventListener("touchstart", press, {passive:true});
    b.addEventListener("touchend", release, {passive:true});
    b.addEventListener("touchcancel", release, {passive:true});
  });
}

setupControls();

// *** DYNAMIC DEVICE VIEWPORT CALCULATION TO STRETCH ASPECT WIDTH ***
function viewportW(){
  return Math.max(320, Math.floor((window.visualViewport ? window.visualViewport.width : innerWidth) / 0.55));
} 
function viewportH(){
  return Math.max(240, Math.floor((window.visualViewport ? window.visualViewport.height : innerHeight) / 0.55));
}

const game = new Phaser.Game({
  type: Phaser.AUTO,
  parent: "game",
  backgroundColor: "#05070b",
  // *** SYSTEM LAYOUT EXPANSION SCALE ENFORCED ***
  scale: {
    mode: Phaser.Scale.RESIZE, 
    autoCenter: Phaser.Scale.NO_CENTER, 
    width: viewportW(), 
    height: viewportH()
  },
  physics: {default:"arcade", arcade:{debug:false}},
  pixelArt: true,
  roundPixels: true,
  scene: [GameScene],
  render: {pixelArt:false, antialias:true}
});

function forceResize(){
  const w = viewportW(), h = viewportH();
  // Adjust canvas component base wrapper bounds to match true landscape scale distribution
  const canvasEl = document.querySelector("#game canvas");
  if(canvasEl) {
    canvasEl.style.width = "100dvw";
    canvasEl.style.height = "100dvh";
  }
  if(game && game.scale) game.scale.resize(w, h);
}
addEventListener("resize", forceResize);
})();
