  {id:"STRAIGHT_14", type:"straight", tile:"straight2"},
  {id:"STRAIGHT_15", type:"straight", tile:"straight1"},

  {id:"STRAIGHT_16", type:"straight", tile:"straight2"},

function loopChunk(){
  const n = HIGHWAY_LOOP.length;
  return ((LOOP_CHUNK % n) + n) % n;
}
function highwayLoopConfig(){
  const c = HIGHWAY_LOOP[loopChunk()];
  return {
    key:"highway_loop_" + loopChunk(),
    zone:c.id,
    base:HIGHWAY_TILE_PATHS[c.tile],
    mask:null,
    spawn:[0.50,LOOP_ENTRY==="north" ? 0.12 : 0.88],
    objective:`Highway Loop ${loopChunk()+1}/${HIGHWAY_LOOP.length}: ${c.id}`,
    exitText:"Continue Highway Loop"
  };
}

function cfSaveActiveVehicle(scene){
  try{
    if(!scene || !scene.vehicleMode || !scene.vehicle) return;
    const data={
      active:true,
      stolen:!!scene.vehicle.stolen,
      carKey:(scene.vehicle.texture&&scene.vehicle.texture.key)||"donny_car",
      speed:Math.round(scene.vehicleSpeed||0),
      heading:Math.round(scene.vehicleHeading ?? ((scene.vehicle.angle||0)-90)),
      lane: scene.nearestLaneIndexForX ? scene.nearestLaneIndexForX(scene.vehicle.x,scene.vehicle.y) : 1,

function cfClamp01(v){ return Math.max(0, Math.min(1, v)); }

function cfRoadCenterX(scene,y,laneIndex){
  // v112e road guide based on actual curved highway screenshots.
  // Normalized y. On lower curve, lanes sweep from left to right as they go north.
  const t=cfClamp01(y/scene.mapH);
  const straight=[scene.mapW*.215, scene.mapW*.365, scene.mapW*.680, scene.mapW*.815];
  let x=straight[Phaser.Math.Clamp(laneIndex||0,0,3)];

  // Curve chunks have strong bend in lower half.
  // Push lane center along a broad S curve so traffic stays on asphalt.
  const bend = Math.sin((1-t)*Math.PI*0.95);
  const lowerBoost = cfClamp01((.82-t)/.55);
  const curve = bend * lowerBoost * scene.mapW*.28;

  // Left lanes bend less, right lanes bend more.
  const laneFactor=[-.42,-.18,.18,.42][Phaser.Math.Clamp(laneIndex||0,0,3)];
  x += curve + laneFactor*scene.mapW*.08*lowerBoost;

  return Phaser.Math.Clamp(x, scene.mapW*.08, scene.mapW*.92);
}

function cfRoadHeading(scene,y,laneIndex,dir){
  const y1=Phaser.Math.Clamp(y-18,0,scene.mapH);
  const y2=Phaser.Math.Clamp(y+18,0,scene.mapH);
  const x1=cfRoadCenterX(scene,y1,laneIndex);
  const x2=cfRoadCenterX(scene,y2,laneIndex);
  // Direction of travel. dir < 0 means north/up.
  const dx = dir < 0 ? (x1-x2) : (x2-x1);
  const dy = dir < 0 ? (y1-y2) : (y2-y1);
  return Phaser.Math.RadToDeg(Math.atan2(dy,dx));
}

function cfHeadingForTrafficDir(dir, scene, y){ return dir < 0 ? -90 : 90; }
function cfVehicleVisualAngleFromHeading(heading){
  // Top-down vehicle PNGs face UP/NORTH at visual angle 0.
  return heading + 90;
}

function makeBeepSound(freq=360, duration=0.18, type="square", volume=0.12){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!window.__cfAudioCtx) window.__cfAudioCtx=new AC();
    const ctx=window.__cfAudioCtx;
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.type=type;
    osc.frequency.value=freq;
    gain.gain.value=volume;
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+duration);
    osc.stop(ctx.currentTime+duration);
  }catch(e){}
}

// ================================================================
// VEHICLE SYSTEM v119 — clean modular player/AI separation
// VehicleState · RoadPathManager · TrafficManager · VehicleController
// ================================================================

const VM = Object.freeze({IDLE:'IDLE',PLAYER:'PLAYER',AI:'AI',PARKED:'PARKED',DESPAWNED:'DESPAWNED'});

class VehicleRecord {
  constructor(id, type, sprite){
    this.id=id; this.type=type; this.sprite=sprite;
    this.mode=VM.AI; this.chunkId=null; this.isPlayerOwned=false;
    // AI namespace — TrafficManager ONLY reads/writes these
    this.ai={aiSpeed:0,aiHeading:0,aiLane:0,targetSpeed:2.2,dir:1,chunkId:null};
    // Player namespace — VehicleController ONLY reads/writes these
    this.player={playerSpeed:0,playerHeading:0};
  }
  get x(){return this.sprite?this.sprite.x:0;}
  get y(){return this.sprite?this.sprite.y:0;}
}

class VehicleState {
  constructor(){
    this._vehicles=new Map();
    this._playerVehicleId=null;
  }
  register(id,type,sprite){
    if(this._vehicles.has(id)) this._vehicles.get(id).sprite=sprite;
    else this._vehicles.set(id,new VehicleRecord(id,type,sprite));
    return this._vehicles.get(id);
  }
  unregister(id){
    const r=this._vehicles.get(id);
    if(r){r.mode=VM.DESPAWNED; this._vehicles.delete(id);}
  }
  get(id){return this._vehicles.get(id)||null;}
  all(){return Array.from(this._vehicles.values());}
  traffic(){return this.all().filter(v=>v.mode===VM.AI||v.mode===VM.PARKED);}
  get playerVehicleId(){return this._playerVehicleId;}
  getPlayerVehicle(){return this._playerVehicleId?this._vehicles.get(this._playerVehicleId)||null:null;}
  setPlayerVehicle(id){
    const prev=this.getPlayerVehicle();
    if(prev&&prev.id!==id){prev.mode=VM.AI;prev.isPlayerOwned=false;}
    const next=this._vehicles.get(id);
    if(!next){console.error('[VS] unknown id:',id);return;}
    next.mode=VM.PLAYER; next.isPlayerOwned=true;
    next.player.playerHeading=next.ai.aiHeading;
    next.player.playerSpeed=0;
    this._playerVehicleId=id;
  }
  clearPlayerVehicle(){
    const prev=this.getPlayerVehicle();
    if(prev){prev.mode=VM.PARKED;prev.isPlayerOwned=false;prev.player.playerSpeed=0;}
    this._playerVehicleId=null;
  }
  inChunk(chunkId){return this.all().filter(v=>v.chunkId===chunkId);}
  despawnChunk(chunkId){
    for(const v of this.inChunk(chunkId).filter(v=>!v.isPlayerOwned)){
      if(v.sprite&&v.sprite.active){try{v.sprite.destroy();}catch(e){}}
      this.unregister(v.id);
    }
  }
  debug(){
    const pv=this.getPlayerVehicle();
    return {
      id:this._playerVehicleId||'on foot',
      type:pv?pv.type:'none',
      mode:pv?pv.mode:'FOOT',
      count:this.traffic().length
    };
  }
}

class RoadPathManager {
  constructor(scene){this.scene=scene;}
  laneX(laneIdx,y){
    return (typeof cfRoadCenterX==='function')
      ? cfRoadCenterX(this.scene,y,Phaser.Math.Clamp(laneIdx,0,3))
      : [this.scene.mapW*.215,this.scene.mapW*.365,this.scene.mapW*.680,this.scene.mapW*.815][laneIdx||0];
  }
  dir(laneIdx){return laneIdx<2?1:-1;}
  headingForDir(d){return d>0?90:-90;}
}

class TrafficManager {
  constructor(scene,vs,rpm){
    this.scene=scene; this.vs=vs; this.rpm=rpm;
    this._debugText=null; this._chunkId=null;
  }
  // Register a spawned traffic sprite in VS so it's tracked
  track(id,type,sprite,laneIdx,chunkId){
    const r=this.vs.register(id,type,sprite);
    r.mode=VM.AI; r.chunkId=chunkId;
    r.ai.aiLane=laneIdx;
    r.ai.dir=this.rpm.dir(laneIdx);
    r.ai.aiHeading=this.rpm.headingForDir(r.ai.dir);
    r.ai.aiSpeed=sprite.trafficSpeed||2.2;
    r.ai.targetSpeed=r.ai.aiSpeed;
    r.ai.knockVX=0; r.ai.knockVY=0; r.ai.knockDecay=0.86;
    return r;
  }
  setChunk(id){this._chunkId=id;}
  // Pure AI update — never touches the player vehicle
  update(dt){
    const delta=Math.max(.5,Math.min(1.75,(dt||16)/16.666));
    const playerVehicleId=this.vs.playerVehicleId;
    for(const v of this.vs.traffic()){
      if(v.id===playerVehicleId) continue; // STRICT player separation
      if(!v.sprite||v.sprite.active===false) continue;
      this._aiStep(v,delta);
    }
    this._debugDraw();
  }
  _aiStep(v,delta){
    const laneIdx=Phaser.Math.Clamp(v.ai.aiLane,0,3);
    const dir=v.ai.dir;
    const speed=Phaser.Math.Clamp(v.ai.aiSpeed,.5,3.5);
    v.sprite.y+=dir*speed*delta;
    // Apply collision knockback (decays each frame)
    if(v.ai.knockVX||v.ai.knockVY){
      v.sprite.x+=(v.ai.knockVX||0);
      v.sprite.y+=(v.ai.knockVY||0);
      v.ai.knockVX=(v.ai.knockVX||0)*(v.ai.knockDecay||0.86);
      v.ai.knockVY=(v.ai.knockVY||0)*(v.ai.knockDecay||0.86);
      if(Math.abs(v.ai.knockVX)<0.25) v.ai.knockVX=0;
      if(Math.abs(v.ai.knockVY)<0.25) v.ai.knockVY=0;
    }
    const sc=this.scene;
    if(v.sprite.y<-140) v.sprite.y=sc.mapH+140;
    if(v.sprite.y>sc.mapH+140) v.sprite.y=-140;
    // Snap X using road curve formula (only when not being knocked sideways)
    const knockMag=Math.abs(v.ai.knockVX||0)+Math.abs(v.ai.knockVY||0);
    if(knockMag<0.8) v.sprite.x=this.rpm.laneX(laneIdx,v.sprite.y);
    // Visual angle: follow road curve using cfRoadHeading; fallback to straight up/down
    if(typeof cfRoadHeading==='function' && typeof cfVehicleVisualAngleFromHeading==='function'){
      v.sprite.angle=cfVehicleVisualAngleFromHeading(cfRoadHeading(this.scene,v.sprite.y,laneIdx,dir));
    } else {
      v.sprite.angle=dir<0?0:180;
    }
    v.sprite.setDepth(DEPTH.CHARACTER_BASE+Math.floor(v.sprite.y));
    // Move name label
    if(v.sprite.nameLabel) v.sprite.nameLabel.setPosition(v.sprite.x,v.sprite.y-72);
    // Legacy compat: keep car.trafficLane.x in sync
    if(v.sprite.trafficLane) v.sprite.trafficLane.x=v.sprite.x;
  }
  // Vehicle collision: player↔NPC and NPC↔NPC. Called every frame from updateTraffic().
  collisions(){
    const sc=this.scene;
    const PR=34; // player collision radius (px)
    const aiList=Array.from(this.vs.traffic());
    // Player ↔ NPC
    if(sc.vehicleMode && sc.vehicle){
      const px=sc.vehicle.x, py=sc.vehicle.y;
      for(const v of aiList){
        if(!v.sprite||v.sprite.active===false) continue;
        const dx=px-v.sprite.x, dy=py-v.sprite.y;
        const distSq=dx*dx+dy*dy;
        const minD=PR+(v.sprite.trafficRadius||54);
        if(distSq>minD*minD||distSq<0.01) continue;
        const dist=Math.sqrt(distSq);
        const pen=minD-dist;
        const nx=dx/dist, ny=dy/dist; // normal: NPC→player
        // Separate: push player 55%, NPC 45%
        sc.vehicle.x+=nx*pen*0.55;
        sc.vehicle.y+=ny*pen*0.55;
        v.sprite.x-=nx*pen*0.45;
        v.sprite.y-=ny*pen*0.45;
        // Player knockback — only deflect when moving toward the NPC
        const vc=sc.VC;
        const spd=vc?vc._speed:(sc.vehicleSpeed||0);
        const hdgRad=Phaser.Math.DegToRad(vc?vc._heading:(sc.vehicleHeading||0));
        const dot=Math.cos(hdgRad)*(-nx)+Math.sin(hdgRad)*(-ny); // positive = heading into NPC
        if(dot>0.05){
          const impact=Math.min(Math.abs(spd),280)*dot;
          if(vc){
            vc._speed*=Phaser.Math.Clamp(1-(impact/340),0.18,0.80);
            // Deflect heading: push away from NPC along normal
            vc._heading+=nx*(impact*0.055);
          } else {
            sc.vehicleSpeed*=0.35;
          }
          // Screen shake — scales with impact magnitude
          if(impact>25&&sc.cameras?.main) sc.cameras.main.shake(Math.min(180,impact*0.55),Phaser.Math.Clamp(impact/8000,0.002,0.010));
          // Orange tint flash on the NPC
          const sp=v.sprite;
          if(sp.setTint) sp.setTint(0xff6622);
          sc.time?.delayedCall?.(200,()=>{try{sp.clearTint();}catch(e){}});
        }
        // NPC knockback impulse (decays in _aiStep)
        const impulse=Math.min(Math.abs(spd),280)*0.055;
        v.ai.knockVX=(v.ai.knockVX||0)+(-nx)*impulse;
        v.ai.knockVY=(v.ai.knockVY||0)+(-ny)*impulse;
        v.ai.knockDecay=0.84;
      }
    }
    // NPC ↔ NPC separation (prevents pile-ups)
    for(let i=0;i<aiList.length;i++){
      for(let j=i+1;j<aiList.length;j++){
        const a=aiList[i],b=aiList[j];
        if(!a.sprite||!b.sprite||a.sprite.active===false||b.sprite.active===false) continue;
        const dx=a.sprite.x-b.sprite.x, dy=a.sprite.y-b.sprite.y;
        const distSq=dx*dx+dy*dy;
        const minD=(a.sprite.trafficRadius||54)+(b.sprite.trafficRadius||54);
        if(distSq>minD*minD||distSq<0.01) continue;
        const dist=Math.sqrt(distSq);
        const pen=minD-dist;
        const nx=dx/dist, ny=dy/dist;
        a.sprite.x+=nx*pen*0.5; a.sprite.y+=ny*pen*0.5;
        b.sprite.x-=nx*pen*0.5; b.sprite.y-=ny*pen*0.5;
        // Gentle knockback so they drift apart
        const k=pen*0.10;
        a.ai.knockVX=(a.ai.knockVX||0)+nx*k; a.ai.knockVY=(a.ai.knockVY||0)+ny*k;
        b.ai.knockVX=(b.ai.knockVX||0)-nx*k; b.ai.knockVY=(b.ai.knockVY||0)-ny*k;
      }
    }
  }
  showDebug(){
    if(this._debugText) return;
    this._debugText=this.scene.add.text(12,12,'',{
      fontSize:'11px',fontFamily:'monospace',color:'#00ff88',
      backgroundColor:'#00000099',padding:{x:7,y:5}
    }).setScrollFactor(0).setDepth(10000);
  }
  _debugDraw(){
    if(!this._debugText) return;
    const d=this.vs.debug();
    this._debugText.setText([
      `VEH ID  : ${d.id}`,
      `VEH TYPE: ${d.type}`,
      `VEH MODE: ${d.mode}`,
      `TRAFFIC : ${d.count}`,
      `CHUNK   : ${this._chunkId!==null?this._chunkId:'?'}`
    ]);
  }
}

class VehicleController {
  constructor(scene,vs,inputRef){
    this.scene=scene; this.vs=vs; this.inp=inputRef;
    this._speed=0; this._heading=0;
  }
  get speed(){return this._speed;}
  set speed(v){this._speed=v; const pv=this.vs.getPlayerVehicle(); if(pv) pv.player.playerSpeed=v;}
  get heading(){return this._heading;}
  set heading(v){this._heading=v; const pv=this.vs.getPlayerVehicle(); if(pv) pv.player.playerHeading=v;}
  // Called once on enter
  syncFromVehicle(sprite,storedHeading,storedSpeed){
    this._heading=storedHeading!==undefined?storedHeading:(sprite.angle||0)-180;
    this._speed=storedSpeed||0;
  }
  update(delta){
    const pv=this.vs.getPlayerVehicle();
    if(!pv) return false;
    const sprite=pv.sprite;
    if(!sprite||sprite.active===false) return false;
    const sc=this.scene;
    if(typeof pauseOpen!=='undefined'&&(pauseOpen||shopOpen||dialogueOpen)) return false;
    const sec=Math.min(0.050,(delta||16)/1000);
    const inp=this.inp;
    const steer=Math.abs(inp.x)>0.10?inp.x:0;
    const gas=!!inp.a||!!inp.vgas;
    const brake=!!inp.b||!!inp.vbrake;
    const handbrake=!!inp.r;
    const absSpeed=Math.abs(this._speed);
    const turnRate=(handbrake?230:125)*(0.35+Math.min(absSpeed/230,1));
    this._heading+=steer*turnRate*sec;
    if(gas) this._speed+=340*sec;
    if(brake){
      if(this._speed>12) this._speed-=520*sec;
      else this._speed-=220*sec;
    }
    if(!gas&&!brake) this._speed*=Math.pow(0.982,sec*60);
    if(handbrake) this._speed*=Math.pow(0.955,sec*60);
    this._speed=Phaser.Math.Clamp(this._speed,-135,330);
    if(Math.abs(this._speed)<1.4) this._speed=0;
    const rad=Phaser.Math.DegToRad(this._heading);
    sprite.x+=Math.cos(rad)*this._speed*sec;
    sprite.y+=Math.sin(rad)*this._speed*sec;
    sprite.x=Phaser.Math.Clamp(sprite.x,12,sc.mapW-12);
    sprite.y=Phaser.Math.Clamp(sprite.y,12,sc.mapH-12);
    sprite.angle=cfCarVisualAngle(this._heading);
    // Sync backward-compat scene properties
    sc.vehicleSpeed=this._speed;
    sc.vehicleHeading=this._heading;
    if(sc.player){sc.player.setPosition(sprite.x,sprite.y);sc.player.setVisible(false);}
    if(sc.vehicleLabel) sc.vehicleLabel.setPosition(sprite.x,sprite.y-58);
    if(sc.cameras&&sc.cameras.main) sc.cameras.main.centerOn(sprite.x,sprite.y);
    return true;
  }
}

createTrafficTextures(){
  if(this._trafficTexturesReady) return;
  this._trafficTexturesReady=true;
  this.trafficTextureKeys=[];

  // Uploaded sheets are 6 columns x 2 rows. Each cell is a separate top-down vehicle.
  for(let s=1;s<=5;s++){
    const sheetKey=`traffic_sheet_${String(s).padStart(2,"0")}`;
    if(!this.textures.exists(sheetKey) || FAILED_ASSETS.has(sheetKey)) continue;
    const src=this.textures.get(sheetKey).getSourceImage();
    const cols=6, rows=2;
    const cellW=Math.floor(src.width/cols);
    const cellH=Math.floor(src.height/rows);
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        const key=`traffic_${s}_${r}_${c}`;
        if(this.textures.exists(key)){ this.trafficTextureKeys.push(key); continue; }
        const canvas=document.createElement("canvas");
        canvas.width=cellW; canvas.height=cellH;
        const ctx=canvas.getContext("2d");
        ctx.drawImage(src, c*cellW, r*cellH, cellW, cellH, 0, 0, cellW, cellH);
        this.textures.addCanvas(key, canvas);
        this.trafficTextureKeys.push(key);
      }
    }
  }
}


createV123TrafficTexture(key,color="#c46a2b"){

  ctx.fillStyle=color; ctx.strokeStyle="#060910"; ctx.lineWidth=5;
  ctx.beginPath(); ctx.roundRect(-24,-58,48,116,12); ctx.fill(); ctx.stroke();
  ctx.fillStyle="rgba(190,245,255,.75)"; ctx.fillRect(-15,-40,30,21);
  ctx.fillStyle="rgba(15,20,35,.85)"; ctx.fillRect(-17,8,34,26);
  ctx.fillStyle="#05070b";
  ctx.fillRect(-31,-42,8,25); ctx.fillRect(23,-42,8,25);
  ctx.fillRect(-31,21,8,25); ctx.fillRect(23,21,8,25);
  ctx.fillStyle="#ffe86a"; ctx.fillRect(-16,-63,10,5); ctx.fillRect(6,-63,10,5);
  ctx.fillStyle="#ff5858"; ctx.fillRect(-16,58,10,5); ctx.fillRect(6,58,10,5);

nearestJackableTrafficCar(){
  if(!this.trafficCars || !this.trafficCars.length || this.vehicleMode) return null;
  let best=null, bestD=9999;
  const px=this.player?.x||0, py=this.player?.y||0;
  for(const car of this.trafficCars){
    if(!car || car.stolen || car.jacked || !car.visible) continue;
    const d=Phaser.Math.Distance.Between(px,py,car.x,car.y);
    if(d<bestD){ best=car; bestD=d; }
  }
  return bestD<96 ? best : null;
}


vehiclePersistKey(car){
  if(!car) return "donny_car";

nearestLaneIndexForX(x,y){
  const yy = y===undefined ? (this.vehicle?.y || this.mapH*.5) : y;
  let idx=0, best=Math.abs(x-cfRoadCenterX(this,yy,0));
  for(let i=1;i<4;i++){
    const d=Math.abs(x-cfRoadCenterX(this,yy,i));
    if(d<best){best=d;idx=i;}
  }
  return idx;
}

laneXFromIndex(idx,y){

roadAngleForY(y){
  // v112c simple highway road-follow assist:
  // bottom ramp curves inward, upper area straightens north/south.
  const t=Phaser.Math.Clamp(y/this.mapH,0,1);
  if(t>.72) return -72;     // lower ramp approach, angled up/right
  if(t<.18) return -88;     // top exits, mostly north
  return -90;               // straight highway
}

applyRoadFollowAssist(){
  if(!this.vehicleMode || !this.vehicle) return;
  const onHighway=(AREA==="highway"||AREA==="highway_loop");
  if(!onHighway) return;
  const speed=Math.abs(this.vehicleSpeed||0);
  if(speed<18) return;
  const laneIdx=this.nearestLaneIndexForX(this.vehicle.x,this.vehicle.y);
  const laneX=cfRoadCenterX(this,this.vehicle.y,laneIdx);
  const dir=(this.vehicleSpeed||0)>=0 ? -1 : 1;
  const targetHeading=cfRoadHeading(this,this.vehicle.y,laneIdx,dir);
  this.vehicle.x += (laneX-this.vehicle.x)*0.075;
  if(this.vehicleHeading===undefined) this.vehicleHeading=(this.vehicle.angle||0)-90;
  let diff=Phaser.Math.Angle.ShortestBetween(this.vehicleHeading,targetHeading);
  this.vehicleHeading += diff*0.075;
  this.vehicle.angle=cfCarVisualAngle(this.vehicleHeading);
}

tryCarjack(){
  // v119: carjack uses VS for strict player/AI separation
  if(this.vehicleMode) return false;
  const car=this.nearestJackableTrafficCar();
  if(!car) return false;

  const texKey=(car.texture&&car.texture.key)||"donny_car";
  const oldX=car.x, oldY=car.y, oldAngle=car.angle||0;
  if(car.nameLabel){try{car.nameLabel.destroy();}catch(e){} car.nameLabel=null;}
  this.spawnPulledDriver(car);

  // Remove from traffic arrays and VS so TM stops updating it
  if(this.trafficCars) this.trafficCars=this.trafficCars.filter(c=>c!==car);
  if(this.VS && car.__vsId) this.VS.unregister(car.__vsId);
  try{car.destroy();}catch(e){car.setVisible(false);}

  // Create fresh player-only sprite from the traffic car's texture
  const pc=this.add.image(oldX,oldY,texKey).setDepth(DEPTH.CHARACTER_BASE+230).setOrigin(.5,.5).setScale(0.90);
  pc.isPlayerVehicle=true; pc.stolen=true; pc.jacked=true; pc.kind="Stolen Vehicle";
  pc.angle=oldAngle;

  // v119: register in VS as the player vehicle so TM never touches it
  if(this.VS){
    const vid='player_stolen_'+Date.now();
    pc.__vsId=vid;
    const r=this.VS.register(vid,'Stolen:'+texKey,pc);
    r.chunkId=typeof loopChunk==='function'?loopChunk():0;
    this.VS.setPlayerVehicle(vid);
    if(this.VC) this.VC.syncFromVehicle(pc,(oldAngle||0)-180,0);
  }

  if(this.vehicle && this.vehicle!==pc){this.vehicle.setVisible(true); this.vehicle.setAlpha(.55);}
  this.vehicle=pc; this.playerVehicle=pc; this.vehicleMode=true; this.vehicleSpeed=0;
  this.vehicleHeading=(oldAngle||0)-180;
  if(typeof cfCarVisualAngle==="function") pc.angle=cfCarVisualAngle(this.vehicleHeading);

  if(this.player){this.player.setVisible(false); this.player.setPosition(pc.x,pc.y); if(this.player.body)this.player.body.enable=false;}
  if(this.vehicleLabel){
    this.vehicleLabel.setText("STOLEN VEHICLE\nX EXIT").setPosition(pc.x,pc.y-58).setVisible(true);
  }else{
    this.vehicleLabel=this.add.text(pc.x,pc.y-58,"STOLEN VEHICLE\nX EXIT",{fontFamily:"monospace",fontSize:"8px",color:"#9eefff",backgroundColor:"rgba(0,0,0,.55)",padding:{x:4,y:2},align:"center"}).setOrigin(.5).setDepth(DEPTH.LABEL);
  }
  if(this.cameras?.main)this.cameras.main.startFollow(pc,true,0.12,0.12,0,0);
  setMode("IN CAR"); if(document.getElementById("mode")) document.getElementById("mode").textContent="IN CAR";
  if(this.addWanted)this.addWanted(2.2,"carjacking");
  showToast("CARJACKED\n"+texKey);
  return true;
}

updateTraffic(dt){
  // v123: simple AI traffic only. It never reads player input and never collides with player.
  if(!(AREA==="highway" || AREA==="highway_loop")) return;

  if(!this.trafficCars || !this.trafficCars.length){
    if(!this._v123TrafficQueued){
      this._v123TrafficQueued=true;
      this.time?.delayedCall?.(150,()=>{ this._v123TrafficQueued=false; this.spawnTraffic(); });
    }
    return;
  }

  const delta=Math.max(.5,Math.min(1.75,(dt||16)/16.666));

  for(const car of this.trafficCars){
    if(!car || car===this.vehicle || car.isPlayerVehicle || car.stolen || car.jacked) continue;
    const laneIndex=Phaser.Math.Clamp(car.laneIndex ?? 1,0,3);
    const dir=(car.trafficLane && car.trafficLane.dir) || (laneIndex<2 ? 1 : -1);
    const speed=car.trafficSpeed || 1.5;

    car.y += dir * speed * delta;
    if(car.y < -140) car.y=this.mapH+140;
    if(car.y > this.mapH+140) car.y=-140;

    car.x=(typeof cfRoadCenterX==="function") ? cfRoadCenterX(this,car.y,laneIndex) : car.x;
    car.angle=dir<0?0:180;
    car.setDepth(DEPTH.CHARACTER_BASE+Math.floor(car.y));
    if(car.nameLabel) car.nameLabel.setPosition(car.x,car.y-72);
  }
}

}

initWantedSystem(){
  if(this._wantedReady) return;
  this._wantedReady=true;
  const savedWanted=cfLoadWanted ? cfLoadWanted() : null;
  this.wantedLevel=savedWanted?.level||0;
  this.wantedHeat=savedWanted?.heat||0;
  this.wantedDecayTimer=0;
  this.patrolChasers=[];
  this.roadblockCooldown=0;
}
addWanted(amount=1, reason="crime"){
  this.initWantedSystem();
  this.wantedHeat += amount;
  const old=this.wantedLevel||0;
  this.wantedLevel=Phaser.Math.Clamp(Math.floor(this.wantedHeat/2),0,5);
  if(this.wantedLevel>old){
    showToast(`WANTED LEVEL ${this.wantedLevel}\n${reason.toUpperCase()}`);
    this.spawnCivicPatrolChaser();
  }
  this.updateWantedHud();
}
updateWantedHud(){
  if(!wantedLine) return;
  const full="★".repeat(this.wantedLevel||0);
  const empty="☆".repeat(5-(this.wantedLevel||0));
  wantedLine.innerHTML=`<span class="tag">WANTED:</span> ${full}${empty}`;
}
spawnCivicPatrolChaser(){
  if(!(AREA==="highway" || AREA==="highway_loop")) return;
  if(!this.trafficTextureKeys || !this.trafficTextureKeys.length) return;
  const civicKeys=(this.emsTrafficTextureKeys && this.emsTrafficTextureKeys.length) ? this.emsTrafficTextureKeys : this.trafficTextureKeys;
  const key=civicKeys[1 % civicKeys.length] || this.trafficTextureKeys[0];
  const target=this.vehicleMode && this.vehicle ? this.vehicle : this.player;
  const spawnY=target.y + (target.y<this.mapH*.5 ? 260 : -260);
  const spawnX=target.x + (Math.random()>.5 ? 80 : -80);
  const car=this.add.image(
    Phaser.Math.Clamp(spawnX,60,this.mapW-60),
    Phaser.Math.Clamp(spawnY,60,this.mapH-60),
    key
  ).setDepth(DEPTH.CHARACTER_BASE+180).setOrigin(.5,.5).setScale(0.90);
  car.kind="Civic Patrol";
  car.isPatrolChaser=true;
  car.patrolSpeed=0;
  car.patrolHeading=-90;
  car.trafficRadius=62;
  car.nameLabel=this.add.text(car.x,car.y-74,"CIVIC PATROL",{
    fontFamily:"monospace",fontSize:"8px",color:"#ff9e9e",
    backgroundColor:"rgba(0,0,0,.62)",padding:{x:3,y:1}
  }).setOrigin(.5).setDepth(DEPTH.LABEL);
  this.patrolChasers.push(car);
  try{
    if(this.cache.audio.exists("veh_civic_blip")) this.sound.play("veh_civic_blip",{volume:.35});
    else if(this.cache.audio.exists("veh_police")) this.sound.play("veh_police",{volume:.25});
  }catch(e){}
}
updateWantedSystem(dt){
  this.initWantedSystem();
  const delta=dt||16;
  this.wantedDecayTimer += delta;
  if(this.wantedLevel>0 && this.wantedDecayTimer>2500){
    this.wantedDecayTimer=0;
    const target=this.vehicleMode && this.vehicle ? this.vehicle : this.player;
    let nearPatrol=false;
    for(const p of this.patrolChasers||[]){
      if(Phaser.Math.Distance.Between(target.x,target.y,p.x,p.y)<360) nearPatrol=true;
    }
    if(!nearPatrol){
      this.wantedHeat=Math.max(0,this.wantedHeat-0.35);
      this.wantedLevel=Phaser.Math.Clamp(Math.floor(this.wantedHeat/2),0,5);
    }
  }
  this.updateWantedHud();

  // Spawn more patrols if heat is high and not enough chasers.
  if((this.wantedLevel||0)>0 && (!this.patrolChasers || this.patrolChasers.length<this.wantedLevel)){
    if(Math.random()<0.006) this.spawnCivicPatrolChaser();
  }

  this.updatePatrolChasers(delta);
}
updatePatrolChasers(dt){
  if(!this.patrolChasers) return;
  const sec=Math.min(.05,(dt||16)/1000);
  const target=this.vehicleMode && this.vehicle ? this.vehicle : this.player;
  this.patrolChasers=this.patrolChasers.filter(car=>{
    if(!car || !target) return false;
    const dx=target.x-car.x, dy=target.y-car.y;
    const dist=Math.hypot(dx,dy)||1;
    const desired=Phaser.Math.RadToDeg(Math.atan2(dy,dx));
    if(car.patrolHeading===undefined) car.patrolHeading=desired;
    let diff=Phaser.Math.Angle.ShortestBetween(car.patrolHeading,desired);
    car.patrolHeading += diff*0.055;
    car.patrolSpeed += 190*sec;
    car.patrolSpeed=Phaser.Math.Clamp(car.patrolSpeed,0,265+(this.wantedLevel*18));
    const rad=Phaser.Math.DegToRad(car.patrolHeading);
    car.x += Math.cos(rad)*car.patrolSpeed*sec;
    car.y += Math.sin(rad)*car.patrolSpeed*sec;
    car.angle=cfCarVisualAngle ? cfCarVisualAngle(car.patrolHeading) : car.patrolHeading+180;
    if(car.nameLabel) car.nameLabel.setPosition(car.x,car.y-74);

    // Collision: patrol rams player vehicle and raises heat.
    if(this.vehicleMode && this.vehicle){
      const d=Phaser.Math.Distance.Between(this.vehicle.x,this.vehicle.y,car.x,car.y);
      if(d<92){
        const nx=(this.vehicle.x-car.x)/(d||1);
        const ny=(this.vehicle.y-car.y)/(d||1);
        this.vehicle.x += nx*14;
        this.vehicle.y += ny*14;
        if(this.vehicleSpeed!==undefined) this.vehicleSpeed*=0.65;
        this.addWanted(0.25,"ramming patrol");
        try{ if(this.cache.audio.exists("veh_crash")) this.sound.play("veh_crash",{volume:.35}); }catch(e){}
      }
    }

    if(car.x<-220 || car.x>this.mapW+220 || car.y<-220 || car.y>this.mapH+220){
      if(car.nameLabel) car.nameLabel.destroy();
      car.destroy();
      return false;
    }
    return true;
  });
}
maybeWantedFromDriving(){

  const speed=Math.abs(this.vehicleSpeed||0);
  if(speed>250 && Math.random()<0.0025) this.addWanted(0.15,"reckless driving");

forceSpawnTrafficAllChunks(){
  if(!(AREA==="highway" || AREA==="highway_loop")) return;
  if(this._trafficForcedReady) return;
  this._trafficForcedReady=true;
  this.time.delayedCall(250, ()=>{
    try{
      if(!this.trafficCars || this.trafficCars.length<4){
        if(this.spawnTraffic) this.spawnTraffic();
      }
      if(this.trafficCars && this.trafficCars.length){
        this.trafficCars=this.trafficCars.filter(c=>!(c&&c.isPlayerVehicle));
        for(let i=0;i<this.trafficCars.length;i++){
          const car=this.trafficCars[i];
          if(!car) continue;
          car.visible=true;
          if(car.nameLabel) car.nameLabel.visible=true;
          // stagger y positions differently per chunk so every screen has traffic immediately
          car.y = this.mapH*(0.06 + (((i*0.113)+(loopChunk()*0.071))%0.88));
          if(car.trafficLane && car.trafficLane.x) car.x=car.trafficLane.x;
        }
      }
    }catch(e){ console.warn("v112j traffic force spawn failed", e); }
  });
}
hideTransitionDebugMarkers(){

createHighwayVehicle(){
  if(AREA!=="highway" && AREA!=="highway_loop") return;
  // v75: Donny's car/van placed on the off-ramp shoulder, clear of the Westgate exit marker.
  this.vehicle = this.physics.add.image(this.mapW*0.50, this.mapH*0.72, "donny_car")
    .setDepth(DEPTH.CHARACTER_BASE + 2600)
    .setScale(0.082)
    .setAngle(0)
    .setInteractive({useHandCursor:true});
  this.vehicle.on("pointerdown",()=>{ if(this.vehicleMode) this.exitVehicle(); else this.enterVehicle(); });
  if(this.vehicle.body){
    this.vehicle.body.setSize(26,54);
    this.vehicle.body.immovable = true;
  }
  // v112c: entry edge spawn preserves same lane/road section.
  if(AREA==="highway_loop"){
    const laneIdx=Phaser.Math.Clamp(parseInt(qs.get("lane")||"1",10)||1,0,3);
    const spawnY=(LOOP_ENTRY==="north"?this.mapH*0.12:this.mapH*0.88); const x=this.laneXFromIndex ? this.laneXFromIndex(laneIdx,spawnY) : this.mapW*0.50;
    if(LOOP_ENTRY==="north"){
      this.vehicle.setPosition(x,this.mapH*0.12);
      this.vehicleHeading=90;
      this.vehicle.angle=cfCarVisualAngle(this.vehicleHeading);
    } else {
      this.vehicle.setPosition(x,this.mapH*0.88);
      this.vehicleHeading=-90;
      this.vehicle.angle=cfCarVisualAngle(this.vehicleHeading);
    }
  }
  this.vehicleMode=false;
  // v118: keep current/stolen vehicle across highway chunks.
  // cfClearVehicleState();
  cfUpdateVehicleAudio(this);
  // cfClearActiveVehicle();
  this.playerVehicle=this.vehicle;
  this.originalDonnyVehicle=this.vehicle;
  if(vehicleControls) vehicleControls.style.display="none";

  // v120: do NOT call createTrafficTextures() here.
  // Calling it early sets _trafficTexturesReady=true before the loop runs; if anything
  // fails (silently caught), trafficTextureKeys stays [] and spawnTraffic() exits with no cars.
  // Stolen texture restore is deferred to spawnTraffic() via this._pendingStolenRestore.

  // v112g: restore current/stolen vehicle after screen transition.
  const activeVehicle=cfLoadActiveVehicle();
  if((qs.get("vehicle")==="car" || qs.get("persist")==="1" || activeVehicle) && this.vehicle){
    const carKey=qs.get("carKey") || activeVehicle?.carKey;
    const stolen=(qs.get("stolen")==="1") || !!activeVehicle?.stolen;
    if(carKey && this.textures.exists(carKey)){
      this.vehicle.setTexture(carKey);
    } else if(carKey && carKey!=="donny_car"){
      // v120: traffic textures don't exist yet — spawnTraffic() will apply this after creating them
      this._pendingStolenRestore={carKey,stolen};
    }
    this.vehicle.stolen=stolen;
    this.vehicle.jacked=stolen;
    this.playerVehicle=this.vehicle;
    this.vehicleMode=true;
    const savedSpeed=parseFloat(qs.get("speed") || activeVehicle?.speed || "0");
    const savedHeading=parseFloat(qs.get("heading") || activeVehicle?.heading || "-90");
    if(!Number.isNaN(savedSpeed)) this.vehicleSpeed=savedSpeed;
    if(!Number.isNaN(savedHeading)){
      this.vehicleHeading=savedHeading;
      if(typeof cfVehicleVisualAngleFromHeading==="function") this.vehicle.angle=cfCarVisualAngle(this.vehicleHeading);
    }
    if(this.player){ this.player.setVisible(false); this.player.setPosition(this.vehicle.x,this.vehicle.y); }
    if(this.vehicleLabel){
      this.vehicleLabel.setText(stolen?"STOLEN VEHICLE\nX EXIT":"DONNY'S CAR\nX EXIT").setPosition(this.vehicle.x,this.vehicle.y-58).setVisible(true);
    }
    setMode("IN CAR"); if(document.getElementById("mode")) document.getElementById("mode").textContent="IN CAR";
  }

  const normalBtns=document.querySelector(".buttons"); if(normalBtns) normalBtns.style.display="block";
  input.a=false; input.b=false; input.vgas=false; input.vbrake=false;
  this.carCruise=false;
  this.autoDrive=false;
  // v118: do not overwrite restored/persisted speed after chunk transition.
  if(this.vehicleSpeed===undefined || Number.isNaN(this.vehicleSpeed)) this.vehicleSpeed=0;
  if(this.vehicleFuel===undefined) this.vehicleFuel=100;
  this.vehicleMaxSpeed=10.0;
  this.vehicleTurnRate=2.7;
  this.vehicleFriction=0.94;
  this.vehicleLabel=this.add.text(this.vehicle.x,this.vehicle.y-58,"DONNY'S CAR\nTAP CAR TO ENTER",{
    fontFamily:"monospace",fontSize:"10px",color:"#9eefff",
    backgroundColor:"rgba(0,0,0,.60)",padding:{x:4,y:2},align:"center"
  }).setOrigin(.5).setDepth(DEPTH.LABEL+700);

  // v119: init vehicle systems now (traffic not yet spawned)
  if(!this.VS){
    this.VS=new VehicleState();
    this.RPM=new RoadPathManager(this);
    this.VC=new VehicleController(this,this.VS,input);
    this.TM=new TrafficManager(this,this.VS,this.RPM);
    this.TM.setChunk(typeof loopChunk==='function'?loopChunk():0);
    this.TM.showDebug();
  }
  // Register Donny's car as player vehicle in VS
  const _dvid='donny_car_persistent';
  this.vehicle.__vsId=_dvid;
  this.VS.register(_dvid,'donny_car',this.vehicle);
  // If vehicle mode is already restored (chunk persistence), set player vehicle
  if(this.vehicleMode){
    this.VS.setPlayerVehicle(_dvid);
    if(this.VC) this.VC.syncFromVehicle(this.vehicle,this.vehicleHeading,this.vehicleSpeed);
  }
  this._donnyCarSprite=this.vehicle;
}
ensureEngineAudio(){
  // v75 procedural fallback engine audio: no external sound file required.
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!this.engineCtx) this.engineCtx = new AC();
    if(this.engineCtx.state === "suspended") this.engineCtx.resume();
    if(this.engineOsc) return;
    const ctx=this.engineCtx;
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    const filter=ctx.createBiquadFilter();
    osc.type="sawtooth";
    osc.frequency.value=46;
    filter.type="lowpass";
    filter.frequency.value=160;
    gain.gain.value=0.0001;
    osc.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    this.engineOsc=osc;
    this.engineGain=gain;
    this.engineFilter=filter;
  }catch(e){ console.warn("engine audio unavailable", e); }
}
setEngineVolume(active=false){
  if(!this.engineGain || !this.engineOsc) return;
  const ctx=this.engineCtx;
  const sp=Math.abs(this.vehicleSpeed||0);
  const target=active ? Math.min(0.12,0.035+sp*0.012) : 0.0001;
  const freq=active ? Math.min(135,48+sp*15) : 46;
  this.engineGain.gain.cancelScheduledValues(ctx.currentTime);
  this.engineGain.gain.linearRampToValueAtTime(target, ctx.currentTime+0.08);
  this.engineOsc.frequency.cancelScheduledValues(ctx.currentTime);
  this.engineOsc.frequency.linearRampToValueAtTime(freq, ctx.currentTime+0.08);
}
nearCarForEntry(){
  if(!this.vehicle || !this.player || this.vehicleMode) return false;
  const d=Phaser.Math.Distance.Between(this.player.x,this.player.y,this.vehicle.x,this.vehicle.y);
  return d < 190;
}

  return input.a === true;
}
mobileBrakeDown(){
  return input.b === true;
}
mobileUsePressed(){
  return input.xbtn === true || input.usePressed === true;
}
enterVehicle(){
  if(!this.vehicle || this.vehicleMode) return;
  this.vehicleMode=true;
  this.vehicleUseLockUntil=this.time ? this.time.now+350 : performance.now()+350;

  // v96: Donny is synced into the car instead of being left beside it.
  this.player.setPosition(this.vehicle.x,this.vehicle.y);
  this.player.setVisible(false);
  if(this.player.body) this.player.body.enable=false;

  if(vehicleControls) vehicleControls.style.display="none";
  const normalBtns=document.querySelector(".buttons");
  if(normalBtns){ normalBtns.style.display="block"; normalBtns.style.opacity="1"; normalBtns.style.pointerEvents="auto"; }

  input.a=false; input.b=false; input.xbtn=false; input.usePressed=false;
  this.vehicleSpeed=0;
  this.vehicleHeading=this.vehicle.angle-180;

  this.cameras.main.startFollow(this.vehicle,true,0.12,0.12,0,0);
  this.ensureEngineAudio();
  this.setEngineVolume(false);
  setObjective("Drive north/south edge to change screens");
  showToast("IN CAR\nA gas • B brake/reverse • stick steers • X exit");
}
exitVehicle(){
  if(!this.vehicle || !this.vehicleMode) return;
  this.vehicleMode=false;
  if(this.vehicle) this.vehicle.setAlpha(1);
  this.vehicleUseLockUntil=this.time ? this.time.now+350 : performance.now()+350;

  input.a=false; input.b=false; input.xbtn=false; input.usePressed=false;
  this.vehicleSpeed=0;
  this.setEngineVolume(false);

  // Put Donny beside the car on exit.
  const a=Phaser.Math.DegToRad(this.vehicle.angle || 0);
  const sideX=Math.cos(a+Math.PI/2)*46;
  const sideY=Math.sin(a+Math.PI/2)*46;
  this.player.setPosition(this.vehicle.x+sideX,this.vehicle.y+sideY);
  if(this.player.body) this.player.body.enable=true;
  this.player.setVisible(true);

  const normalBtns=document.querySelector(".buttons");
  if(normalBtns){ normalBtns.style.display="block"; normalBtns.style.opacity="1"; normalBtns.style.pointerEvents="auto"; }
  if(vehicleControls) vehicleControls.style.display="none";

  this.cameras.main.startFollow(this.player,true,0.12,0.12,0,0);
  if(carHudBlock) carHudBlock.style.display="none";
  // v119: clear player vehicle in VS so TM never confuses it with traffic
  if(this.VS) this.VS.clearPlayerVehicle();
  if(this.VC){this.VC._speed=0; this.VC._heading=this.vehicleHeading||0;}
  setObjective("On foot");
  showToast("ON FOOT");
}

updateCarHud(){
  try{
    if(!carHudBlock) carHudBlock=document.getElementById("carHudBlock");
    if(!speedBar) speedBar=document.getElementById("speedBar");
    if(!fuelBar) fuelBar=document.getElementById("fuelBar");
    if(!carHudBlock || !speedBar || !fuelBar) return;
    if(!this.vehicleMode){
      carHudBlock.style.display="none";
      return;
    }
    carHudBlock.style.display="block";
    const speed=Math.abs(this.vehicleSpeed||0);
    const speedPct=Phaser.Math.Clamp((speed/6.0)*100,0,100);
    if(this.vehicleFuel===undefined || Number.isNaN(this.vehicleFuel)) this.vehicleFuel=100;
    if(speed>0.15 && input.a){
      this.vehicleFuel=Math.max(0,this.vehicleFuel-0.002*speed);
    }
    speedBar.style.width=speedPct.toFixed(1)+"%";
    fuelBar.style.width=this.vehicleFuel.toFixed(1)+"%";
  }catch(e){}
}

updateVehicle(dt){
  if(!this.vehicle || !this.vehicleMode) return;
  // v119: prefer VC.update if VS tracks a player vehicle (clean path)
  if(this.VC && this.VS && this.VS.getPlayerVehicle()){
    this.VC.update(dt);
    return;
  }
  // Legacy fallback path (no VS yet)
  const sec=Math.max(0.010, Math.min(0.040, (dt||16)/1000));

  // v97: buttons drive the car. Stick only steers/directs.
  const steer=Math.abs(input.x)>0.10 ? input.x : 0;
  const gas=input.a===true;
  const brake=input.b===true;
  const handbrake=input.r===true;

  if(this.vehicleHeading === undefined) this.vehicleHeading = this.vehicle.angle - 90;
  if(this.vehicleSpeed === undefined) this.vehicleSpeed = 0;

  const absSpeed=Math.abs(this.vehicleSpeed);
  const turnRate=(handbrake ? 210 : 115) * (0.35 + Math.min(absSpeed/260, 1.0));
  this.vehicleHeading += steer * turnRate * sec;

  if(gas) this.vehicleSpeed += 310 * sec;
  if(brake) this.vehicleSpeed -= (this.vehicleSpeed > 20 ? 470 : 235) * sec;

  this.vehicleSpeed=Phaser.Math.Clamp(this.vehicleSpeed, -145, 340);

  // Coast/friction.
  if(handbrake) this.vehicleSpeed *= Math.pow(0.76, sec*8);
  else if(!gas && !brake) this.vehicleSpeed *= Math.pow(0.955, sec*8);

  if(Math.abs(this.vehicleSpeed)<2) this.vehicleSpeed=0;

  const rad=Phaser.Math.DegToRad(this.vehicleHeading);
  this.vehicle.x += Math.cos(rad)*this.vehicleSpeed*sec;
  this.vehicle.y += Math.sin(rad)*this.vehicleSpeed*sec;

  this.vehicle.x=Phaser.Math.Clamp(this.vehicle.x,12,this.mapW-12);
  this.vehicle.y=Phaser.Math.Clamp(this.vehicle.y,12,this.mapH-12);

  // v107 GTA-style lane snap for Donny's car on straight highway.
  if((AREA==="highway" || AREA==="highway_loop") && this.vehicleMode && this.vehicle){
    const highwayLanes=[this.mapW*.215,this.mapW*.365,this.mapW*.680,this.mapW*.815];
    let nearest=highwayLanes[0], best=Math.abs(this.vehicle.x-highwayLanes[0]);
    for(const lx of highwayLanes){
      const d=Math.abs(this.vehicle.x-lx);
      if(d<best){ best=d; nearest=lx; }
    }
    const movingFast=Math.abs(this.vehicleSpeed||0)>2.2;
    const verticalish=Math.abs(input.y)>Math.abs(input.x)*0.65 || Math.abs(input.y)>0.25;
    if(movingFast && verticalish && best<85 && !input.r){
      this.vehicle.x += (nearest-this.vehicle.x)*0.035;
    }
  }


  // v118: topdown car art orientation; keep stable and smooth.
  this.vehicle.angle=cfCarVisualAngle(this.vehicleHeading);

  // Keep Donny inside vehicle.
  if(this.player){
    this.player.setPosition(this.vehicle.x,this.vehicle.y);
    this.player.setVisible(false);
  }

  if(this.vehicleLabel){
    this.vehicleLabel.setPosition(this.vehicle.x,this.vehicle.y-58);
    this.vehicleLabel.setText("DRIVING\\nNORTH EDGE NEXT • SOUTH EDGE PREV • X EXIT");
  }

  this.setEngineVolume(Math.abs(this.vehicleSpeed)>3);
  if(typeof this.checkHighwayLoopTransitions === "function") this.checkHighwayLoopTransitions();

  this.updateCarHud();

  coordLine.innerHTML=`<span class="tag">XY:</span> ${Math.round(this.vehicle.x)},${Math.round(this.vehicle.y)} <span class="tag">CAR:</span> v118 SAFE <span class="tag">A:</span>${gas?1:0} <span class="tag">B:</span>${brake?1:0} <span class="tag">R:</span>${handbrake?1:0} <span class="tag">STEER:</span>${steer.toFixed(1)} <span class="tag">SPD:</span>${Math.round(this.vehicleSpeed)}`;
}
fixClubNpcFloorDepth(){

  if(this.npcs){

goHighwayLoop(step){
  const n=HIGHWAY_LOOP.length;
  const next=((loopChunk()+step)%n+n)%n;
  const entry = step>0 ? "south" : "north";
  // v119: sync VS speed/heading back to scene props before save
  if(this.VC && this.VS && this.VS.getPlayerVehicle()){
    this.vehicleSpeed=this.VC._speed;
    this.vehicleHeading=this.VC._heading;
  }
  if(this.vehicleMode && this.vehicle) cfSaveVehicleState(this);
  if(this.wantedLevel>0) cfSaveWanted(this);
  const inCar=this.vehicleMode?"&vehicle=car":"";
  const carKey=this.vehicleMode&&this.vehicle?`&carKey=${encodeURIComponent(cfCurrentCarKey(this))}`:"";
  const stolen=this.vehicleMode&&this.vehicle&&this.vehicle.stolen?"&stolen=1":"";
  const spd=this.vehicleMode?`&speed=${Math.round(this.vehicleSpeed||0)}`:"";
  const lane=this.vehicle&&this.nearestLaneIndexForX?this.nearestLaneIndexForX(this.vehicle.x,this.vehicle.y):1;
  const heading=this.vehicleHeading!==undefined?Math.round(this.vehicleHeading):(step>0?-90:90);
  location.replace(location.pathname+`?v=westgate-v118&area=highway_loop&chunk=${next}&entry=${entry}&lane=${lane}${inCar}${carKey}${stolen}${spd}&heading=${heading}&persist=1&collision=off&t=${Date.now()}`);
}
checkHighwayLoopTransitions(){
  if(AREA!=="highway_loop" || !this.vehicle || !this.vehicleMode) return;

  // v100: continuous north/south highway screens.
  // North edge = next screen, stay in car. South edge = previous screen, stay in car. No button prompt.
  const edgePad = 28;
  if(this.vehicle.y <= edgePad){
    this.goHighwayLoop(1);
    return;
  }
  if(this.vehicle.y >= this.mapH - edgePad){
    this.goHighwayLoop(-1);
    return;
  }

  if(this.loopOfframpZone && Phaser.Math.Distance.Between(this.vehicle.x,this.vehicle.y,this.loopOfframpZone.x,this.loopOfframpZone.y)<this.loopOfframpZone.r){
    setObjective("Off-ramp: "+this.loopOfframpZone.exit+" / X to enter later");
  } else {
    setObjective("Drive north/south edge to change screens screen");
  }
}

lockCameraToPlayer(){
  if(!this.cameras || !this.cameras.main) return;
  const cam=this.cameras.main;
  const viewW=cam.width/cam.zoom;
  const viewH=cam.height/cam.zoom;
  cam.scrollX=Phaser.Math.Clamp(cam.scrollX,0,Math.max(0,this.mapW-viewW));
  cam.scrollY=Phaser.Math.Clamp(cam.scrollY,0,Math.max(0,this.mapH-viewH));
}

v123DriveUpdate(dt){
  if(!this.vehicle || !this.vehicleMode) return;
  if(this.vehicleHeading===undefined || Number.isNaN(this.vehicleHeading)) this.vehicleHeading=(this.vehicle.angle||0)-180;
  if(this.vehicleSpeed===undefined || Number.isNaN(this.vehicleSpeed)) this.vehicleSpeed=0;

  const sec=Math.max(0.010, Math.min(0.050, (dt||16)/1000));
  const steer=Math.abs(input.x)>0.10 ? input.x : 0;
  const gas=!!input.a || !!input.vgas;
  const brake=!!input.b || !!input.vbrake;
  const handbrake=!!input.r;

  const absSpeed=Math.abs(this.vehicleSpeed);
  const turnRate=(handbrake?230:125)*(0.35+Math.min(absSpeed/230,1));
  this.vehicleHeading += steer * turnRate * sec;

  if(gas) this.vehicleSpeed += 340*sec;
  if(brake){
    if(this.vehicleSpeed>12) this.vehicleSpeed -= 520*sec;
    else this.vehicleSpeed -= 220*sec;
  }
  if(!gas && !brake) this.vehicleSpeed *= Math.pow(0.982,sec*60);
  if(handbrake) this.vehicleSpeed *= Math.pow(0.955,sec*60);
  this.vehicleSpeed=Phaser.Math.Clamp(this.vehicleSpeed,-145,340);
  if(Math.abs(this.vehicleSpeed)<1.4) this.vehicleSpeed=0;

  const rad=Phaser.Math.DegToRad(this.vehicleHeading);
  this.vehicle.x += Math.cos(rad)*this.vehicleSpeed*sec;
  this.vehicle.y += Math.sin(rad)*this.vehicleSpeed*sec;
  this.vehicle.x=Phaser.Math.Clamp(this.vehicle.x,12,this.mapW-12);
  this.vehicle.y=Phaser.Math.Clamp(this.vehicle.y,12,this.mapH-12);
  this.vehicle.angle=cfCarVisualAngle(this.vehicleHeading);

  if(this.player){ this.player.setPosition(this.vehicle.x,this.vehicle.y); this.player.setVisible(false); }
  if(this.vehicleLabel) this.vehicleLabel.setPosition(this.vehicle.x,this.vehicle.y-58).setVisible(true);
  if(this.cameras?.main) this.cameras.main.centerOn(this.vehicle.x,this.vehicle.y);
  if(this.updateCarHud) this.updateCarHud();
  cfSaveActiveVehicle(this);
  coordLine.innerHTML=`<span class="tag">XY:</span> ${Math.round(this.vehicle.x)},${Math.round(this.vehicle.y)} <span class="tag">CAR:</span> v123 <span class="tag">SPD:</span>${Math.round(this.vehicleSpeed)} <span class="tag">A:</span>${input.a?1:0} <span class="tag">B:</span>${input.b?1:0}`;
}

if(Phaser.Input.Keyboard.JustDown(this.keys.ESC)) { unlockControls(); forceControlsLive(); }

  const len=Math.hypot(vx,vy), moving=len>.15; if(moving){vx/=len;vy/=len;}

 unstuckPlayer(){

handleUse(){
  // v112b: carjacking has priority over entering Donny's parked car.
  // If Donny is on foot near traffic and presses X, steal traffic car first.
  if((AREA==="highway" || AREA==="highway_loop") && !this.vehicleMode && this.tryCarjack && this.tryCarjack()){
    return;
  }

  // v96 vehicle enter/exit first.
  if((AREA==="highway" || AREA==="highway_loop") && this.vehicle){
    const now=this.time ? this.time.now : performance.now();
    if(this.vehicleUseLockUntil && now < this.vehicleUseLockUntil) return;
    if(this.vehicleMode){ this.exitVehicle(); return; }
    this.enterVehicle(); return;
  }

  // v92 vehicle enter/exit first.
  if((AREA==="highway" || AREA==="highway_loop") && this.vehicle){
    const now=this.time ? this.time.now : performance.now();
    if(this.vehicleUseLockUntil && now < this.vehicleUseLockUntil) return;
    if(this.vehicleMode){ this.vehicleUseLockUntil=now+350; this.exitVehicle(); return; }
    this.vehicleUseLockUntil=now+350; this.enterVehicle(); return;
  }

  // v91 vehicle enter/exit first, before off-ramp transitions.
  if((AREA==="highway" || AREA==="highway_loop") && this.vehicle){
    const now=this.time ? this.time.now : performance.now();
    if(this.vehicleUseLockUntil && now < this.vehicleUseLockUntil) return;
    if(this.vehicleMode){ this.vehicleUseLockUntil=now+350; this.exitVehicle(); return; }

  }

  // v84 highway direct use.
  if(AREA==="highway" && this.vehicle){
    if(this.vehicleMode){ this.exitVehicle(); return; }
    this.enterVehicle(); return;
  }

  // v83 highway X enter anywhere: highway is a vehicle test page.

    if(this.vehicleMode){ this.exitVehicle(); return; }

function cfTankDrive(scene, dt){
  if(!scene || !scene.vehicleMode || !scene.vehicle || pauseOpen || shopOpen || dialogueOpen) return false;
  // v119: use VC if VS has a player vehicle (preferred, no duplication)
  if(scene.VC && scene.VS && scene.VS.getPlayerVehicle()){
    const ok=scene.VC.update(dt);
    if(ok){
      cfUpdateVehicleAudio(scene);
      if(!!scene.inp?.r && Math.abs(scene.vehicleSpeed)>80 && Math.random()<0.045) cfPlayTireScreech(scene);
      if(coordLine) coordLine.innerHTML=`<span class="tag">XY:</span> ${Math.round(scene.vehicle.x)},${Math.round(scene.vehicle.y)} <span class="tag">CAR:</span> VC <span class="tag">SPD:</span>${Math.round(scene.vehicleSpeed)} <span class="tag">HDG:</span>${Math.round(scene.vehicleHeading)}`;
      return true;
    }
  }
  const sec=Math.min(.05,(dt||16)/1000);
  if(scene.vehicleHeading===undefined) scene.vehicleHeading=(scene.vehicle.angle||0)-90;
  if(scene.vehicleSpeed===undefined) scene.vehicleSpeed=0;

  const steer=Math.abs(input.x)>0.10 ? input.x : 0; // thumb stick turns only
  const gas=!!input.a || !!input.vgas;
  const brake=!!input.b || !!input.vbrake;
  const handbrake=!!input.r;

  const absSpeed=Math.abs(scene.vehicleSpeed);
  const turnRate=(handbrake?230:125)*(0.35+Math.min(absSpeed/230,1));
  scene.vehicleHeading += steer*turnRate*sec;

  if(gas) scene.vehicleSpeed += 340*sec;
  if(brake){
    if(scene.vehicleSpeed>12) scene.vehicleSpeed -= 520*sec;
    else scene.vehicleSpeed -= 220*sec;
  }
  if(!gas && !brake) scene.vehicleSpeed *= .982;
  if(handbrake) scene.vehicleSpeed *= .955;
  scene.vehicleSpeed=Phaser.Math.Clamp(scene.vehicleSpeed,-135,330);
  if(Math.abs(scene.vehicleSpeed)<1.4) scene.vehicleSpeed=0;

  const rad=Phaser.Math.DegToRad(scene.vehicleHeading);
  scene.vehicle.x += Math.cos(rad)*scene.vehicleSpeed*sec;
  scene.vehicle.y += Math.sin(rad)*scene.vehicleSpeed*sec;
  scene.vehicle.x=Phaser.Math.Clamp(scene.vehicle.x,12,scene.mapW-12);
  scene.vehicle.y=Phaser.Math.Clamp(scene.vehicle.y,12,scene.mapH-12);
  scene.vehicle.angle=cfCarVisualAngle(scene.vehicleHeading);

  if(scene.player){scene.player.setPosition(scene.vehicle.x,scene.vehicle.y);scene.player.setVisible(false);}
  if(scene.vehicleLabel)scene.vehicleLabel.setPosition(scene.vehicle.x,scene.vehicle.y-58);
  if(scene.cameras&&scene.cameras.main)scene.cameras.main.centerOn(scene.vehicle.x,scene.vehicle.y);
  if(scene.updateCarHud)scene.updateCarHud();
  if(scene.checkHighwayLoopTransitions)scene.checkHighwayLoopTransitions();
  cfUpdateVehicleAudio(scene);
  if(handbrake && Math.abs(scene.vehicleSpeed)>80 && Math.random()<0.045) cfPlayTireScreech(scene);

  if(coordLine) coordLine.innerHTML=`<span class="tag">XY:</span> ${Math.round(scene.vehicle.x)},${Math.round(scene.vehicle.y)} <span class="tag">CAR:</span> TANK <span class="tag">A:</span>${gas?1:0} <span class="tag">B:</span>${brake?1:0} <span class="tag">STEER:</span>${steer.toFixed(2)} <span class="tag">SPD:</span>${Math.round(scene.vehicleSpeed)}`;
  return true;
}

function cfStartVehicleAudio(scene){

    };

function cfUpdateVehicleAudio(scene){
  try{
    if(!scene || !scene.vehicleMode){ 
      if(scene?.sndDrive) scene.sndDrive.setVolume(0);
      if(scene?.sndBoost) scene.sndBoost.setVolume(0);
      if(scene?.sndIdle) scene.sndIdle.setVolume(0.05);
      return;
    }
    cfStartVehicleAudio(scene);
    const speed=Math.min(1, Math.abs(scene.vehicleSpeed||0)/260);
    const gas=!!input.a || !!input.vgas;
    if(scene.sndIdle) scene.sndIdle.setVolume(0.10 + (1-speed)*0.10);
    if(scene.sndDrive) scene.sndDrive.setVolume(0.05 + speed*0.28);
    if(scene.sndBoost) scene.sndBoost.setVolume(gas && speed>.35 ? 0.18 : 0.0);
  }catch(e){}
}

// v113j: clean independent world NPC manager.
// This is intentionally separate from old visibleCivilians / spritesheet NPC code.
function cfNpcMake(scene,x,y,label,color){
  const c=scene.add.container(x,y).setDepth(DEPTH.CHARACTER_BASE+270);
  const shadow=scene.add.ellipse(0,12,23,8,0x000000,.38);
  const legs=scene.add.rectangle(0,8,10,16,0x1f2734,.95).setStrokeStyle(1,0x05070b,.9);
  const body=scene.add.rectangle(0,-5,14,20,color,.98).setStrokeStyle(1,0x05070b,.9);
  const head=scene.add.circle(0,-21,7,0xc98b5c,.98).setStrokeStyle(1,0x05070b,.9);
  c.add([shadow,legs,body,head]);
  c.homeX=x; c.homeY=y;
  c.vx=(Math.random()>.5?1:-1)*(0.18+Math.random()*0.12);
  c.vy=(Math.random()>.5?1:-1)*(0.10+Math.random()*0.10);
  c.labelText=scene.add.text(x,y-42,label,{
    fontFamily:"monospace",fontSize:"8px",color:"#e8fbff",
    backgroundColor:"rgba(0,0,0,.68)",padding:{x:4,y:2}
  }).setOrigin(.5).setDepth(DEPTH.LABEL+60);
  c.isWorldNpc=true;
  return c;
}
function cfNpcClear(scene){
  if(!scene.cfWorldNpcs) scene.cfWorldNpcs=[];
  for(const n of scene.cfWorldNpcs){
    try{ if(n.labelText) n.labelText.destroy(); n.destroy(); }catch(e){}
  }
  scene.cfWorldNpcs=[];
}
function cfNpcLayout(scene){
  const c=(typeof loopChunk==="function")?loopChunk():0;
  // Fixed safe shoulder/sidewalk positions per chunk. Never attached to the player car.
  const base=[
    [0.13,0.22],[0.86,0.24],
    [0.14,0.48],[0.85,0.52],
    [0.16,0.75],[0.82,0.78]
  ];
  return base.map((p,i)=>({
    x:Phaser.Math.Clamp(scene.mapW*p[0] + (((c+i)%3)-1)*18, 54, scene.mapW-54),
    y:Phaser.Math.Clamp(scene.mapH*p[1] + ((c+i)%2?14:-14), 54, scene.mapH-54)
  }));
}
function cfNpcSpawn(scene){
  if(!(AREA==="highway" || AREA==="highway_loop")) return;
  const key=`${AREA}:${loopChunk()}:${scene.mapW}x${scene.mapH}`;
  if(scene.cfNpcKey===key && scene.cfWorldNpcs && scene.cfWorldNpcs.length) return;
  cfNpcClear(scene);
  const labels=["Civilian","Mechanic","Water Carrier","Elderly","Civilian","Civilian"];
  const colors=[0x8bb6ff,0xa0a0a0,0x2f7cff,0xd8bd7a,0xd08cff,0x88d18a];
  const pts=cfNpcLayout(scene);
  for(let i=0;i<pts.length;i++){
    scene.cfWorldNpcs.push(cfNpcMake(scene,pts[i].x,pts[i].y,labels[(i+loopChunk())%labels.length],colors[(i+loopChunk())%colors.length]));
  }
  scene.cfNpcKey=key;
  showToast(`NPC MANAGER\n${scene.cfWorldNpcs.length} NPCs on chunk ${loopChunk()}`);
}
function cfNpcUpdate(scene,dt){
  if(!(AREA==="highway" || AREA==="highway_loop")) return;
  if(!scene.cfWorldNpcs || !scene.cfWorldNpcs.length || scene.cfNpcKey!==`${AREA}:${loopChunk()}:${scene.mapW}x${scene.mapH}`){
    cfNpcSpawn(scene);
    return;
  }
  const delta=Math.max(.8,Math.min(2,(dt||16)/16.666));
  const car=scene.vehicleMode && scene.vehicle ? scene.vehicle : null;
  for(const n of scene.cfWorldNpcs){
    n.x+=n.vx*delta; n.y+=n.vy*delta;
    if(Math.abs(n.x-n.homeX)>38) n.vx*=-1;
    if(Math.abs(n.y-n.homeY)>30) n.vy*=-1;
    if(car){
      const d=Phaser.Math.Distance.Between(car.x,car.y,n.x,n.y);
      if(d<95){
        n.x+=(n.x-car.x)/(d||1)*2.0;
        n.y+=(n.y-car.y)/(d||1)*2.0;
      }
    }
    if(n.labelText) n.labelText.setPosition(n.x,n.y-42);
  }
}
function cfTrafficKeepStable(scene){
  if(!scene || !scene.trafficCars) return;
  for(const car of scene.trafficCars){
    if(!car || car===scene.vehicle || car.isPlayerVehicle || car.stolen) continue;
    if(car.trafficLane && typeof cfTrafficVisualAngleFromDir==="function"){
      car.angle=cfTrafficVisualAngleFromDir(car.trafficLane.dir);
    }
  }
}


function cfTrafficVisualAngleFromDir(dir){

}

function setupControls(){
  const stick=document.getElementById("stick");
  const nub=document.getElementById("nub");
  const buttons=document.querySelector(".buttons");

  if(buttons){
    buttons.style.pointerEvents="auto";
    buttons.style.opacity="1";
    buttons.style.zIndex=9999;
  }
  if(stick){
    stick.style.pointerEvents="auto";
    stick.style.touchAction="none";
    stick.style.zIndex=9999;
  }
  document.querySelectorAll(".btn").forEach(btn=>{
    btn.style.pointerEvents="auto";
    btn.style.touchAction="none";
  });

  let dragging=false;
  let lastDir="down";

  function resetStick(){
    dragging=false;
    input.x=0;
    input.y=0;
    if(nub) nub.style.transform="translate(0px,0px)";
  }

  function point(e){
    if(e.touches && e.touches.length) return {x:e.touches[0].clientX, y:e.touches[0].clientY};
    return {x:e.clientX, y:e.clientY};
  }

  function moveStick(clientX, clientY){
    if(!stick || !nub) return;
    const r=stick.getBoundingClientRect();
    const cx=r.left+r.width/2;
    const cy=r.top+r.height/2;
    let dx=clientX-cx;
    let dy=clientY-cy;
    const max=42;
    const len=Math.hypot(dx,dy) || 1;
    if(len>max){
      dx=dx/len*max;
      dy=dy/len*max;
    }
    input.x=dx/max;
    input.y=dy/max;
    nub.style.transform=`translate(${dx}px,${dy}px)`;
  }

  function directMoveTick(){
    const sc=window.__cfScene;
    if(dragging && sc && !dialogueOpen && !shopOpen && !pauseOpen){
      const vx=input.x, vy=input.y;
      const len=Math.hypot(vx,vy);
      if(len>.12){
        if(sc.vehicleMode && sc.vehicle){
          // v112h: thumb stick steers only. It must not drag/move the car.
          if(sc.player){ sc.player.setPosition(sc.vehicle.x,sc.vehicle.y); sc.player.setVisible(false); }
          if(coordLine) coordLine.innerHTML=`<span class="tag">XY:</span> ${Math.round(sc.vehicle.x)},${Math.round(sc.vehicle.y)} <span class="tag">CAR:</span> STEER ONLY <span class="tag">JOY:</span> ${input.x.toFixed(1)},${input.y.toFixed(1)} <span class="tag">A:</span>${input.a?1:0} <span class="tag">B:</span>${input.b?1:0}`;
        } else if(sc.player){
          const speed=input.r ? 4.1 : 2.75; // pixels per frame, direct fallback
          sc.tryMove(vx*speed, vy*speed);
          const dir=Math.abs(vx)>Math.abs(vy)?(vx>0?"right":"left"):(vy>0?"down":"up");
          lastDir=dir;
          sc.player.dir=dir;
          const sideMove = (dir==="left" || dir==="right");
          const animDir = sideMove ? "left" : dir;
          const key=`donny_${input.r?"run":"walk"}_${animDir}`;
          if(sc.anims && sc.anims.exists(key)) sc.player.play(key,true);
          sc.player.setFlipX(dir==="right");
        }
      }
    }
    requestAnimationFrame(directMoveTick);
  }
  requestAnimationFrame(directMoveTick);

  if(stick){
    ["pointerdown","touchstart","mousedown"].forEach(type=>{
      stick.addEventListener(type,e=>{
        e.preventDefault();
        e.stopPropagation();
        hardStartMusic();
        dragging=true;
        const p=point(e);
        moveStick(p.x,p.y);
      }, {passive:false});
    });

    ["pointermove","touchmove","mousemove"].forEach(type=>{
      window.addEventListener(type,e=>{
        if(!dragging) return;
        e.preventDefault();
        e.stopPropagation();
        const p=point(e);
        moveStick(p.x,p.y);
      }, {passive:false});
    });

    ["pointerup","touchend","mouseup","touchcancel","pointercancel","blur"].forEach(type=>{
      window.addEventListener(type,resetStick, {passive:false});
    });
  }

  function useNow(){
    input.usePressed=true;
    const sc=window.__cfScene;
    if(sc && typeof sc.handleUse === "function" && !dialogueOpen && !shopOpen && !pauseOpen){
      try{ sc.handleUse(); }catch(e){ console.warn("direct use failed", e); }
    }
  }

  document.querySelectorAll(".btn").forEach(btn=>{
    function down(e){
      e.preventDefault();
      e.stopPropagation();
      hardStartMusic();
      const name=btn.dataset.btn;
      btn.classList.add("down");
      if(name==="x"){ input.xbtn=true; input.usePressed=true; input.carjackPressed=true; if(window.__cfScene && !window.__cfScene.vehicleMode && window.__cfScene.tryCarjack && window.__cfScene.tryCarjack()){ return; } useNow(); }
      if(name==="r") input.r=true;
      if(name==="a"){ input.a=true; if(window.__cfScene?.vehicleMode && window.__cfScene.vehicleSpeed<0.9) window.__cfScene.vehicleSpeed=0.9; showToast(window.__cfScene?.vehicleMode ? "GAS ON" : "GAS / action slot ready"); }
      if(name==="b"){ input.b=true; showToast(window.__cfScene?.vehicleMode ? "BRAKE" : "BRK / action slot ready"); }
      if(name==="y") showToast("LTS / action slot ready");
    }
    function up(e){
      e.preventDefault();
      e.stopPropagation();
      btn.classList.remove("down");
      if(btn.dataset.btn==="r") input.r=false;
      if(btn.dataset.btn==="a") input.a=false;
      if(btn.dataset.btn==="b") input.b=false;
      if(btn.dataset.btn==="x"){ input.xbtn=false; input.usePressed=false; }
    }
    ["pointerdown","touchstart","mousedown"].forEach(type=>btn.addEventListener(type,down,{passive:false}));
    ["pointerup","touchend","mouseup","touchcancel","pointercancel"].forEach(type=>btn.addEventListener(type,up,{passive:false}));
  });

  // Emergency keyboard/mouse click fallback:
  document.addEventListener("keydown", e=>{
    if(e.key==="x" || e.key==="X" || e.key==="e" || e.key==="E") useNow();
  });
}


function installHardVehicleButtons(){
  if(window.__hardVehicleButtonsInstalled) return;
  window.__hardVehicleButtonsInstalled = true;

  function setBtn(el, down){
    const name = el && el.dataset ? el.dataset.btn : null;
    if(!name) return;
    if(down) el.classList.add("down"); else el.classList.remove("down");

    if(name==="a"){
      input.a = down;
      if(down && window.__cfScene && window.__cfScene.vehicleMode){
        window.__cfScene.vehicleSpeed = Math.max(window.__cfScene.vehicleSpeed || 0, 0.85);
        window.__cfScene.setEngineVolume(true);
      }
    }
    if(name==="b") input.b = down;
    if(name==="r") input.r = down;
    if(name==="x"){
      input.xbtn = down;
      if(down){
        input.usePressed = true;
        const sc = window.__cfScene;
        if(sc && AREA==="highway" && sc.vehicle){
          if(sc.vehicleMode) sc.exitVehicle();
          else sc.enterVehicle();
        } else if(sc && typeof sc.handleUse === "function"){
          sc.handleUse();
        }
      } else {
        input.usePressed = false;
      }
    }
  }

  ["pointerdown","touchstart","mousedown"].forEach(type=>{
    document.addEventListener(type,e=>{
      const btn=e.target && e.target.closest ? e.target.closest(".btn") : null;
      if(!btn) return;
      e.preventDefault();
      e.stopPropagation();
      setBtn(btn,true);
    }, {passive:false, capture:true});
  });

  ["pointerup","pointercancel","touchend","touchcancel","mouseup","mouseleave"].forEach(type=>{
    document.addEventListener(type,e=>{
      document.querySelectorAll(".btn.down").forEach(btn=>setBtn(btn,false));
    }, {passive:false, capture:true});
  });

  document.addEventListener("keydown", e=>{
    const k=e.key.toLowerCase();
    if(k===" " || k==="a") input.a=true;
    if(k==="b") input.b=true;
    if(k==="x" || k==="e"){
      input.xbtn=true; input.usePressed=true;
      const sc=window.__cfScene;
      if(sc && AREA==="highway" && sc.vehicle){
        if(sc.vehicleMode) sc.exitVehicle(); else sc.enterVehicle();
      } else if(sc && typeof sc.handleUse==="function") sc.handleUse();
    }
  }, true);

  document.addEventListener("keyup", e=>{
    const k=e.key.toLowerCase();
    if(k===" " || k==="a") input.a=false;
    if(k==="b") input.b=false;
    if(k==="x" || k==="e"){ input.xbtn=false; input.usePressed=false; }
  }, true);
}


function installDedicatedVehicleControls(){
  if(window.__dedicatedVehicleControlsInstalled) return;
  window.__dedicatedVehicleControlsInstalled = true;

  function stopCar(sc){
    input.a=false; input.b=false; input.vgas=false; input.vbrake=false;
    if(sc){
      sc.carCruise=false;
      sc.autoDrive=false;
      sc.vehicleSpeed=0;
      sc.setEngineVolume(false);
      showToast("CAR STOPPED");
    }
  }

  if(driveGas){
    ["pointerdown","touchstart","mousedown","click"].forEach(t=>{
      driveGas.addEventListener(t,e=>{
        e.preventDefault(); e.stopPropagation();
        const sc=window.__cfScene;
        input.a=true; input.vgas=true;
        if(sc && sc.vehicleMode){
          sc.carCruise = true;
          sc.autoDrive = true;
          sc.vehicleSpeed = Math.max(sc.vehicleSpeed||0, 6.0);
          sc.setEngineVolume(true);
          showToast("BOOST ON");
        }
      },{passive:false});
    });
  }

  if(driveBrake){
    ["pointerdown","touchstart","mousedown","click"].forEach(t=>{
      driveBrake.addEventListener(t,e=>{
        e.preventDefault(); e.stopPropagation();
        stopCar(window.__cfScene);
      },{passive:false});
    });
  }

  if(driveExit){
    ["pointerdown","touchstart","mousedown","click"].forEach(t=>{
      driveExit.addEventListener(t,e=>{
        e.preventDefault(); e.stopPropagation();
        const sc=window.__cfScene;
        if(sc && sc.vehicleMode) sc.exitVehicle();
      },{passive:false});
    });
  }
}


function installV110MovementFallback(){
  // v119: Car and traffic movement removed from this rAF loop.
  // Traffic: handled exclusively by TM.update() inside Phaser scene.update() → updateTraffic(dt).
  // Player car: handled exclusively by VC.update() inside cfTankDrive() → updateVehicle(dt).
  // Running both here AND in Phaser update caused double-movement jitter and truck spinning.
  // Only foot movement (on-foot Donny) is kept here as a mobile fallback.
  if(window.__v110MovementFallbackInstalled) return;
  window.__v110MovementFallbackInstalled=true;

  function tick(){
    try{
      const sc=window.__cfScene;
      if(sc && sc.player && !sc.vehicleMode && !dialogueOpen && !shopOpen && !pauseOpen){
        const vx=input.x||0, vy=input.y||0;
        const len=Math.hypot(vx,vy);
        if(len>.12){
          const speed=input.r ? 4.1 : 2.75;
          if(sc.tryMove) sc.tryMove(vx*speed,vy*speed);
        }
      }
    }catch(e){}
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

setupControls();
cfInstallButtonFix();
installV110MovementFallback();
installDedicatedVehicleControls();
installHardVehicleButtons();
function viewportW(){return Math.max(320,Math.floor(window.visualViewport?window.visualViewport.width:innerWidth));} function viewportH(){return Math.max(240,Math.floor(window.visualViewport?window.visualViewport.height:innerHeight));}
const game=new Phaser.Game({type:Phaser.AUTO,parent:"game",backgroundColor:"#05070b",scale:{mode:Phaser.Scale.RESIZE,autoCenter:Phaser.Scale.NO_CENTER,width:viewportW(),height:viewportH()},physics:{default:"arcade",arcade:{debug:false}}, pixelArt:true, roundPixels:true,scene:[GameScene],render:{pixelArt:false,antialias:true}});
function forceResize(){const w=viewportW(),h=viewportH();document.getElementById("game").style.width=w+"px";document.getElementById("game").style.height=h+"px";if(game&&game.scale)game.scale.resize(w,h);}
addEventListener("resize",forceResize);addEventListener("orientationchange",()=>setTimeout(forceResize,250));if(visualViewport)visualViewport.addEventListener("resize",forceResize);setTimeout(forceResize,100);
})();
</script>
